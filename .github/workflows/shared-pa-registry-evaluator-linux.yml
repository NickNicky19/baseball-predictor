name: Shared PA registry and evaluator Linux gate

on:
  pull_request:
    branches:
      - codex/shared-pa-experiment-registry-v1
    paths:
      - ".github/workflows/shared-pa-registry-evaluator-linux.yml"
      - "config/shared_pa_experiment_registry_v1.json"
      - "config/shared_pa_experiment_registry_v1_artifact_manifest.json"
      - "config/shared_pa_market_evaluation_contract_v1.json"
      - "config/shared_pa_market_evaluator_v1_file_manifest.json"
      - "config/schemas/shared_pa_experiment_registry_*.schema.json"
      - "config/schemas/shared_pa_market_evaluation_*.schema.json"
      - "docs/research/SHARED_PA_EXPERIMENT_REGISTRY_V1.md"
      - "docs/research/SHARED_PA_MARKET_EVALUATION_ENGINE_V1.md"
      - "reports/shared_pa_experiment_registry_v1_IMPLEMENTED.json"
      - "requirements-prospective-batter-opportunity-ci.lock"
      - "scripts/check_shared_pa_market_evaluator_offline.py"
      - "scripts/check_tracked_secrets.py"
      - "scripts/manage_shared_pa_experiment_registry.py"
      - "src/evaluation/shared_pa_experiment_registry.py"
      - "src/evaluation/shared_pa_market_evaluator.py"
      - "tests/test_shared_pa_experiment_registry.py"
      - "tests/test_shared_pa_market_evaluator.py"
      - "tests/test_shared_pa_research_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-linux-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: "."
    steps:
      - name: Check out exact candidate bytes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-prospective-batter-opportunity-ci.lock

      - name: Install hash-locked test dependencies
        run: python -m pip install --no-deps --require-hashes -r requirements-prospective-batter-opportunity-ci.lock

      - name: Verify exact evaluator bytes offline
        run: python -B scripts/check_shared_pa_market_evaluator_offline.py

      - name: Run exact registry and evaluator tests
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_shared_pa_experiment_registry.py
          tests/test_shared_pa_research_registry.py
          tests/test_shared_pa_market_evaluator.py

      - name: Scan tracked source for likely credentials
        run: python -B scripts/check_tracked_secrets.py

      - name: Prove the gate did not mutate tracked bytes
        run: git diff --exit-code
