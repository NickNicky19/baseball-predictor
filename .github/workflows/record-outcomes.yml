name: Record Outcomes

# Grades YESTERDAY's predictions against final box scores and appends
# prediction->outcome pairs to data/learning/prediction_outcomes.csv via
# OutcomeRecorder — the real pairs file with actual_value + detail columns
# + model_version. This is the step that builds the learning dataset.
#
# Runs at 14:00 UTC (10:00 AM Eastern), after all prior-day games including
# West Coast extra-inning ones are final, and 6 hours BEFORE the 20:00 UTC
# prediction job so the day's collection is closed out first.

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10:00 AM Eastern
  workflow_dispatch:
    inputs:
      date:
        description: "Date to grade (YYYY-MM-DD). Blank = yesterday (US Eastern)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: record-outcomes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve grading date (US Eastern, yesterday)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "grade=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "grade=$(TZ=America/New_York date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      # The archive the daily job commits is what gets graded. If it's
      # missing (no slate, or the predict job failed), skip gracefully.
      - name: Check for prediction archive
        id: check_archive
        run: |
          DATE="${{ steps.date.outputs.grade }}"
          FILE="data/learning/predictions/predictions_${DATE}.json"
          echo "Checking for ${FILE}"
          if [ -f "${FILE}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No archive for ${DATE} — nothing to grade."
          fi

      - name: Record outcomes
        if: steps.check_archive.outputs.found == 'true'
        env:
          PYTHONPATH: .
        run: |
          # Pass the real model config EXPLICITLY. Without --config the recorder
          # falls back to whatever load_config(None) resolves; if that ever
          # yields an empty/partial config the pairs get stamped with the
          # wrong (or a default {}) model_version instead of the live hash.
          # Every recorded pair's provenance depends on this file being loaded.
          python run_record_outcomes.py \
            --date "${{ steps.date.outputs.grade }}" \
            --config config/config.json \
            --verbose

      - name: Commit pairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The real learning dataset. Do NOT point this at data/predictions/ —
          # that was the regression that recorded outcome_computed=False rows.
          git add data/learning/prediction_outcomes.csv || true
          if git diff --cached --quiet; then
            if [ "${{ steps.check_archive.outputs.found }}" = "false" ]; then
              echo "No archive for ${{ steps.date.outputs.grade }} — nothing to commit."
            else
              echo "No new pairs to commit (already graded, or games not final)."
            fi
          else
            git commit -m "Outcomes for ${{ steps.date.outputs.grade }} [skip ci]"
            git push
          fi