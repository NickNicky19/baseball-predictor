name: Record Outcomes

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10:00 AM Eastern
  workflow_dispatch:
    inputs:
      date:
        description: "Date to grade (YYYY-MM-DD). Blank = yesterday (US Eastern)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: record-outcomes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve grading date (US Eastern, yesterday)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "grade=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "grade=$(TZ=America/New_York date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for predictions file
        id: check_preds
        run: |
          DATE="${{ steps.date.outputs.grade }}"
          echo "Checking for data/predictions/preds_${DATE}.csv"
          if [ -f "data/predictions/preds_${DATE}.csv" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record outcomes
        if: steps.check_preds.outputs.found == 'true'
        env:
          PYTHONPATH: .
        run: |
          python run_record_outcomes.py --date "${{ steps.date.outputs.grade }}" --verbose

      - name: Commit pairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add predicted input and outcome files (adjust patterns as needed)
          git add data/predictions/prediction_outcomes.csv data/predictions/prediction_outcomes_* data/predictions/preds_* || true
          if git diff --cached --quiet; then
            if [ "${{ steps.check_preds.outputs.found }}" = "false" ]; then
              echo "No preds file for ${{ steps.date.outputs.grade }} — nothing to commit."
            else
              echo "No new prediction outcomes to commit (already present)."
            fi
          else
            git commit -m "Outcomes for ${{ steps.date.outputs.grade }} [skip ci]"
            git push
          fi
