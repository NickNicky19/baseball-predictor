name: Record Outcomes
# Grades archived predictions against final box scores and appends
# prediction->outcome pairs to data/learning/prediction_outcomes.csv via
# OutcomeRecorder — the real pairs file with actual_value + detail columns
# + model_version. This is the step that builds the learning dataset.
#
# Runs at 14:00 UTC (10:00 AM Eastern), after all prior-day games including
# West Coast extra-inning ones are final, and 6 hours BEFORE the 20:00 UTC
# prediction job so the day's collection is closed out first.
#
# FORWARD-ONLY SETTLEMENT
# -----------------------
# This workflow grades exactly the immediately preceding official MLB date.
# A missed archive, unavailable final, or invalid provenance remains a visible
# terminal failure; it is never re-opened on a later day.  Re-grading older
# dates would reconstruct prospective settlement evidence after the fact and
# must not be used to heal a historical hole.
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10:00 AM Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-outcomes
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --config is passed EXPLICITLY. Without it the recorder falls back to
      # whatever load_config(None) resolves; if that ever yields an empty or
      # partial config the pairs get stamped with the wrong (or a default {})
      # model_version. Every recorded pair's provenance depends on this file
      # being loaded. (OutcomeRecorder._append_pairs now REFUSES to write a
      # row with a blank model_version, so this would fail loudly — but pass
      # it anyway rather than relying on the guard.)
      - name: Record outcomes
        env:
          PYTHONPATH: .
        run: |
          TARGET_DATE="$(TZ=America/New_York date -d 'yesterday' +%F)"
          [[ "$TARGET_DATE" != 2026-05-* ]] || { echo "May 2026 is sealed" >&2; exit 2; }
          echo "Grading the single forward settlement date ${TARGET_DATE}"
          python run_record_outcomes.py \
            --date "${TARGET_DATE}" \
            --config config/config.kbb.json \
            --verbose

      - name: Commit pairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The real learning dataset. Do NOT point this at data/predictions/ —
          # that was the regression that recorded outcome_computed=False rows.
          git add data/learning/prediction_outcomes.csv || true
          if git diff --cached --quiet; then
            echo "No new pairs to commit (all dates already graded, or games not final)."
          else
            git commit -m "Outcomes: forward settlement $(TZ=America/New_York date -d 'yesterday' +%F) [skip ci]"
            git push
          fi
