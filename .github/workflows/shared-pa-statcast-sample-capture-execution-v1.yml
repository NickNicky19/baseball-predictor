name: Shared PA Statcast bounded sample capture (execution)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_workflow_commit_sha:
        description: "Exact commit containing this workflow"
        required: true
        type: string
      expected_runtime_attestation_sha256:
        description: "Expected two-pass clean-Linux runtime attestation"
        required: true
        type: string
      expected_authorization_sha256:
        description: "Historical attempt-3 authority-package SHA-256; spent packages fail before transport"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-pa-statcast-sample-capture-execution
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  CARRIER_COMMIT: 74395e8552cf65701e526d4cba1f08a3e7f286d8
  RUNTIME_POLICY: config/shared_pa_statcast_runtime_authority_v1.json
  REQUEST_PLAN: config/shared_pa_statcast_source_preparation_v1/sample_request_plan.json
  CONTRACT: config/shared_pa_statcast_source_contract_v1.json
  AUTHORIZATION: config/shared_pa_statcast_attempt_03_authority_package_20260801_v1.json
  CARRIER_ATTEMPT_HISTORY: config/shared_pa_statcast_sample_attempt_history_20260731_v1.json
  ATTEMPT_HISTORY: config/shared_pa_statcast_sample_attempt_history_20260802_v3.json
  OUTPUT: data/source/shared_pa_statcast_sample_2023-07-25_attempt-03_v1
  CAPTURE_ARTIFACT_NAME: shared-pa-statcast-attempt-03
  CAPTURE_AUTHORIZATION_STATUS: ATTEMPT_3_SPENT_ATTEMPT_4_UNAUTHORIZED
  EXPECTED_RUNTIME_POLICY_SHA256: 31b6b16063bfb0f8e1535d4475259caa10ff548423df793a9d79bd2616f5f9c3
  EXPECTED_SOURCE_CONTRACT_SHA256: 7078857cc1815e5c8dcecd667a9b6d69079ef31c1fc68057473d1fb1dc9ceebd
  EXPECTED_SOURCE_BUNDLE_SHA256: 22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1
  EXPECTED_REQUEST_PLAN_SHA256: a40abd52a42ed36a49b6fc5d3d91d2202f57e7075a077f8f1abe3252df016994
  EXPECTED_RUNTIME_ATTESTATION_SHA256: 903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5
  EXPECTED_CARRIER_ATTEMPT_HISTORY_SHA256: eb28fbfc18ba777f796abe1db9735579f99a06907d5de856d696d4de5db0aaf5
  EXPECTED_ATTEMPT_HISTORY_SHA256: 43815c024b7e138850001ecdd9f6cb5b7fcb928f8c518a1cbf4c7f6e4fe016b1
  EVENT_NAME: ${{ github.event_name }}
  EVENT_MODE: ${{ github.event_name == 'pull_request' && 'preflight' || github.event_name == 'workflow_dispatch' && 'capture' || 'invalid' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  REQUESTED_WORKFLOW_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_workflow_commit_sha }}
  EXPECTED_RUNTIME_INPUT: ${{ github.event_name == 'pull_request' && '903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5' || inputs.expected_runtime_attestation_sha256 }}
  EXPECTED_AUTHORIZATION_INPUT: ${{ github.event_name == 'pull_request' && '' || inputs.expected_authorization_sha256 }}

jobs:
  workflow-contract:
    name: Validate immutable event-mode separation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the workflow commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REQUESTED_WORKFLOW_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run static event and mutation checks
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - .github/workflows/shared-pa-statcast-sample-capture-execution-v1.yml <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")
          carrier_working_directory = "working-directory: " + chr(36) + "{{ runner.temp }}/statcast-carrier-exec"
          corrected_main_working_directory = "working-directory: " + chr(36) + "{{ github.workspace }}"
          failure_publication_guard = "if: " + chr(36) + "{{ always() && github.event_name == 'workflow_dispatch' }}"
          dispatch_only_guard = "if: " + chr(36) + "{{ github.event_name == 'workflow_dispatch' }}"
          quarantine_marker = '"' + "quarantined" + '": is_failure'
          non_promotion_marker = '"' + "non_promotable" + '": is_failure'
          attempt_three_marker = "ATTEMPT_3_SPENT_ATTEMPT_4_UNAUTHORIZED"
          finalizer_carrier_binding = (
              "      - name: Verify and finalize capture or quarantined failure package from carrier\n"
              "        " + failure_publication_guard + "\n"
              "        shell: bash\n"
              "        " + carrier_working_directory
          )
          finalizer_main_binding = finalizer_carrier_binding.replace(
              carrier_working_directory, corrected_main_working_directory
          )

          def validate(text: str) -> None:
              required = (
                  "pull_request:\n    branches:",
                  "workflow_dispatch:\n    inputs:",
                  "EVENT_MODE:",
                  "github.event_name == 'pull_request' && 'preflight'",
                  "github.event_name == 'workflow_dispatch' && 'capture'",
                  'if event_name not in {"pull_request", "workflow_dispatch"}:',
                  'if event_name == "pull_request" and event_mode != "preflight":',
                  'if event_name == "workflow_dispatch" and event_mode != "capture":',
                  'capture._transport = blocked_transport',
                  'with capture.network_denial_guard()',
                  'rc = capture.authorized_main(argv)',
                  'reservation-03.json',
                  '"prior_attempt_count"] == 2',
                  attempt_three_marker,
                  'shared_pa_statcast_sample_attempt_history_20260802_v3.json',
                  '43815c024b7e138850001ecdd9f6cb5b7fcb928f8c518a1cbf4c7f6e4fe016b1',
                  'scripts/verify_shared_pa_statcast_capture_v1.py',
                  carrier_working_directory,
                  failure_publication_guard,
                  'CAPTURE_QUARANTINED',
                  '"invalid": is_failure',
                  quarantine_marker,
                  non_promotion_marker,
                  'capture-command-status.json',
                  'capture-validation-exit-code',
                  'carrier-verifier-exit-code',
                  'Report preserved terminal status after artifact upload',
                  finalizer_carrier_binding,
                  '--expected-authorization-sha256',
                  '--expected-runtime-attestation-sha256',
                  '--expected-source-bundle-sha256',
                  'test ! -e "$output"',
                  'test ! -e "$work"',
                  'test ! -e "$lock"',
              )
              missing = [needle for needle in required if needle not in text]
              if missing:
                  raise AssertionError(f"event-separation contract missing: {missing}")
              mode_input = "inputs" + ".mode"
              mode_indent = (" " * 6) + "mode:"
              if mode_indent in text or mode_input in text:
                  raise AssertionError("pull_request must have no mode input or mode override")
              expression_prefix = "if: " + chr(36) + "{{ "
              if (expression_prefix + mode_input + " == 'capture }}") in text:
                  raise AssertionError("capture must be selected by event, never by an input")
              if text.count("with capture.network_denial_guard()") < 2:
                  raise AssertionError("application and lower-level network guards are both required")
              if text.count(failure_publication_guard) < 3:
                  raise AssertionError("failure finalization, upload, and terminal reporting must use always()")
              if corrected_main_working_directory in text:
                  raise AssertionError("carrier verifier must not run from corrected main")

          validate(original)
          mutations = {
              "pull_request_guard_removed": original.replace("  pull_request:\n    branches:\n      - main\n", "", 1),
              "event_name_changed": original.replace("github.event_name == 'pull_request'", "github.event_name_tampered == 'pull_request'"),
              "preflight_condition_weakened": original.replace('event_mode != "preflight"', 'event_mode != "capture"'),
              "lower_guard_removed": original.replace('with capture.network_denial_guard()', 'with nullcontext()'),
              "blocking_transport_removed": original.replace('blocked_transport', 'original_transport'),
              "authorization_gate_removed": original.replace('--expected-authorization-sha256', '--authorization-gate-removed'),
              "attempt_history_removed": original.replace('reservation-03.json', 'reservation-99.json'),
              "failure_publication_guard_removed": original.replace(
                  failure_publication_guard,
                  dispatch_only_guard,
                  1,
              ),
              "carrier_verifier_redirected_to_main": original.replace(
                  finalizer_carrier_binding,
                  finalizer_main_binding,
                  1,
              ),
              "quarantine_removed": original.replace(
                  '              ' + quarantine_marker + ',',
                  '              "quarantined": False,',
                  1,
              ),
              "non_promotion_removed": original.replace(
                  '              ' + non_promotion_marker + ',',
                  '              "non_promotable": False,',
                  1,
              ),
              "successor_attempt_history_removed": original.replace(
                  'shared_pa_statcast_sample_attempt_history_20260801_v2.json',
                  'shared_pa_statcast_sample_attempt_history_20260731_v1.json',
              ),
              "attempt_three_gate_removed": original.replace(
                  attempt_three_marker,
                  "ATTEMPT_3_REUSE_PERMITTED",
                  1,
              ),
              "workflow_input_added": original.replace(
                  (" " * 6) + "expected_workflow_commit_sha:",
                  (" " * 6) + "mode: capture" + chr(10) + (" " * 6) + "expected_workflow_commit_sha:",
                  1),
              "attempt_one_reset": original.replace('"prior_attempt_count"] == 2', '"prior_attempt_count"] == 0'),
          }
          for name, mutated in mutations.items():
              try:
                  validate(mutated)
              except AssertionError:
                  continue
              raise AssertionError(f"mutation was not rejected: {name}")
          print("EVENT_MODE_STATIC_CHECK=PASS")
          print("EVENT_MODE_MUTATION_CHECKS=PASS")
          PY

  failure-preservation-regression:
    name: No-network failure-preservation regression
    needs: workflow-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the workflow commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REQUESTED_WORKFLOW_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create exact detached carrier roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_WORKFLOW_COMMIT"
          test "$(git rev-parse "$CARRIER_COMMIT^{commit}")" = "$CARRIER_COMMIT"
          carrier_valid="${RUNNER_TEMP}/statcast-attempt3-valid-carrier"
          carrier_invalid="${RUNNER_TEMP}/statcast-attempt3-invalid-carrier"
          git worktree add --detach "$carrier_valid" "$CARRIER_COMMIT"
          git worktree add --detach "$carrier_invalid" "$CARRIER_COMMIT"
          test "$(git -C "$carrier_valid" rev-parse HEAD)" = "$CARRIER_COMMIT"
          test "$(git -C "$carrier_invalid" rev-parse HEAD)" = "$CARRIER_COMMIT"
          printf 'REGRESSION_CARRIER_VALID=%s\n' "$carrier_valid" >> "$GITHUB_ENV"
          printf 'REGRESSION_CARRIER_INVALID=%s\n' "$carrier_invalid" >> "$GITHUB_ENV"
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
      - name: Run exact attempt-3 valid and failure preflight without networking
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tests/test_shared_pa_statcast_attempt3_authority_preflight.py \
            --workflow .github/workflows/shared-pa-statcast-sample-capture-execution-v1.yml \
            --authorization config/shared_pa_statcast_attempt_03_authority_package_20260801_v1.json \
            --carrier-valid "$REGRESSION_CARRIER_VALID" \
            --carrier-invalid "$REGRESSION_CARRIER_INVALID" \
            --artifact-valid "${RUNNER_TEMP}/statcast-attempt3-synthetic-valid-artifact" \
            --artifact-invalid "${RUNNER_TEMP}/statcast-attempt3-synthetic-failure-artifact"
          python -I -B tests/test_shared_pa_statcast_attempt3_incident_preservation.py \
            --repository .
      - name: Upload downloadable synthetic valid and failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-attempt-03-synthetic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/statcast-attempt3-synthetic-valid-artifact
            ${{ runner.temp }}/statcast-attempt3-synthetic-failure-artifact
          if-no-files-found: error
          retention-days: 90

  independent-attestation:
    name: Clean-Linux attestation (${{ matrix.pass }})
    strategy:
      fail-fast: false
      matrix:
        pass: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CARRIER_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove carrier identity and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARRIER_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
      - name: Install exact hash-locked runtime
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          python -m venv --without-pip "${RUNNER_TEMP}/statcast-runtime-env"
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" install \
            --disable-pip-version-check --no-compile --no-deps --require-hashes \
            -r requirements-direct-batter-pa-source-authority.lock
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" check
      - name: Run static checks and regenerate runtime attestation
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          "$audit_python" -I -B scripts/verify_direct_batter_pa_source_runtime_authority.py \
            --policy "$RUNTIME_POLICY" --check-static
          attestation="${RUNNER_TEMP}/statcast-runtime-${{ matrix.pass }}.json"
          "$audit_python" -I -B - "$RUNTIME_POLICY" "$attestation" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import scripts.capture_shared_pa_statcast_source_v1
          from scripts.verify_direct_batter_pa_source_runtime_authority import (
              canonical_json_bytes, linux_runtime_attestation, load_policy,
          )
          policy = load_policy(Path(sys.argv[1]))
          Path(sys.argv[2]).write_bytes(canonical_json_bytes(linux_runtime_attestation(policy)))
          PY
          observed="$(sha256sum "$attestation" | awk '{print $1}')"
          test "$EXPECTED_RUNTIME_INPUT" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          test "$observed" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          printf '%s  %s\n' "$observed" "$attestation" > "${RUNNER_TEMP}/statcast-runtime-${{ matrix.pass }}.sha256"
      - name: Upload attestation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-sample-runtime-${{ matrix.pass }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/statcast-runtime-${{ matrix.pass }}.json
            ${{ runner.temp }}/statcast-runtime-${{ matrix.pass }}.sha256
          if-no-files-found: error
          retention-days: 90

  attestation-equality:
    name: Verify independent runtime-attestation equality
    needs: independent-attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download first attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-first-${{ github.run_id }}
          path: ${{ runner.temp }}/first
      - name: Download second attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-second-${{ github.run_id }}
          path: ${{ runner.temp }}/second
      - name: Compare byte identities
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent "${RUNNER_TEMP}/first/statcast-runtime-first.json" "${RUNNER_TEMP}/second/statcast-runtime-second.json"
          observed="$(sha256sum "${RUNNER_TEMP}/first/statcast-runtime-first.json" | awk '{print $1}')"
          test "$EXPECTED_RUNTIME_INPUT" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          test "$observed" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          printf '%s\n' "$observed" > "${RUNNER_TEMP}/statcast-runtime-equality.txt"
      - name: Upload equality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-sample-runtime-equality-${{ github.run_id }}
          path: ${{ runner.temp }}/statcast-runtime-equality.txt
          if-no-files-found: error
          retention-days: 90

  execute-authorized-main:
    name: Execute authorized_main (${{ github.event_name }})
    needs: attestation-equality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REQUESTED_WORKFLOW_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove workflow and carrier identities
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$EVENT_MODE" in
            pull_request:preflight) ;;
            workflow_dispatch:capture) ;;
            *) echo "event/mode mismatch" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
            test "$REQUESTED_WORKFLOW_COMMIT" = "$GITHUB_SHA"
            test -n "${{ inputs.expected_workflow_commit_sha }}"
            test -n "${{ inputs.expected_runtime_attestation_sha256 }}"
            test -n "${{ inputs.expected_authorization_sha256 }}"
          else
            test "$EVENT_NAME" = "pull_request"
            test "$EVENT_MODE" = "preflight"
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_WORKFLOW_COMMIT"
          test "$(git rev-parse "$CARRIER_COMMIT^{commit}")" = "$CARRIER_COMMIT"
          execution_root="${RUNNER_TEMP}/statcast-carrier-exec"
          git worktree add --detach "$execution_root" "$CARRIER_COMMIT"
          for bound in "$RUNTIME_POLICY" "$REQUEST_PLAN" "$CONTRACT" "$AUTHORIZATION" "$CARRIER_ATTEMPT_HISTORY" "$ATTEMPT_HISTORY"; do
            target="$execution_root/$bound"
            mkdir -p "$(dirname "$target")"
            cp -- "$GITHUB_WORKSPACE/$bound" "$target"
          done
          test "$(git -C "$execution_root" rev-parse HEAD)" = "$CARRIER_COMMIT"
          for bound in "$RUNTIME_POLICY" "$REQUEST_PLAN" "$CONTRACT" "$AUTHORIZATION" "$CARRIER_ATTEMPT_HISTORY" "$ATTEMPT_HISTORY"; do
            test -f "$execution_root/$bound"
          done
          printf 'EXECUTION_ROOT=%s\n' "$execution_root" >> "$GITHUB_ENV"
          printf '%s\n' "$REQUESTED_WORKFLOW_COMMIT" > "${RUNNER_TEMP}/workflow-commit.txt"
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
      - name: Install exact hash-locked runtime
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          python -m venv --without-pip "${RUNNER_TEMP}/statcast-runtime-env"
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" install \
            --disable-pip-version-check --no-compile --no-deps --require-hashes \
            -r requirements-direct-batter-pa-source-authority.lock
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" check
      - name: Verify every bound identity and incident accounting
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          for pair in \
            "$EXPECTED_RUNTIME_POLICY_SHA256  $RUNTIME_POLICY" \
            "$EXPECTED_SOURCE_CONTRACT_SHA256  $CONTRACT" \
            "$EXPECTED_REQUEST_PLAN_SHA256  $REQUEST_PLAN" \
            "$EXPECTED_CARRIER_ATTEMPT_HISTORY_SHA256  $CARRIER_ATTEMPT_HISTORY" \
            "$EXPECTED_ATTEMPT_HISTORY_SHA256  $ATTEMPT_HISTORY"; do
            printf '%s\n' "$pair" | sha256sum -c -
          done
          observed_bundle="$("$audit_python" -I -B -c 'import sys; sys.path.insert(0, "."); from scripts.capture_shared_pa_statcast_source_v1 import source_bundle_sha256; print(source_bundle_sha256())')"
          test "$observed_bundle" = "$EXPECTED_SOURCE_BUNDLE_SHA256"
          "$audit_python" -I -B - "$CARRIER_ATTEMPT_HISTORY" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["request_id"] == "statcast-2023-07-25"
          assert p["attempt_number"] == 1
          assert p["status"] == "UNAUTHORIZED_QUARANTINED"
          assert p["promoted_to_source_release"] is False
          assert p["parsed_for_modeling"] is False
          assert p["retained_as_authoritative_source"] is False
          assert p["remaining_lifetime_attempts"] == 3
          assert p["request_timestamp_utc"] is None
          PY
          "$audit_python" -I -B - "$ATTEMPT_HISTORY" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["schema_version"] == "shared-pa-statcast-attempt-history-v3"
          assert [row["attempt_number"] for row in p["attempts"]] == [1, 2, 3]
          assert all("PERMANENTLY_CONSUMED" in row["status"] for row in p["attempts"])
          assert p["remaining_attempts"] == [
              {"attempt_number": 4, "status": "UNUSED_UNAUTHORIZED"},
          ]
          assert p["total_external_statcast_requests"] == 3
          assert p["remaining_authorized_attempts"] == 0
          assert p["workflow_dispatch_capture_authorized"] is False
          assert p["attempts"][1]["response_headers"]["retention_status"] == "ATTEMPT_2_CONTENT_TYPE_NOT_RETAINED"
          assert p["attempts"][2]["response_headers"]["content_type"] == "application/download; charset=utf-8"
          assert p["attempts"][2]["artifact"]["id"] == 8826086488
          PY
          observed_authorization="$(sha256sum "$AUTHORIZATION" | awk '{print $1}')"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$EXPECTED_AUTHORIZATION_INPUT" = "$observed_authorization"
          fi
          printf 'ACTIVE_AUTHORIZATION_SHA256=%s\n' "$observed_authorization" >> "$GITHUB_ENV"
          "$audit_python" -I -B scripts/verify_direct_batter_pa_source_runtime_authority.py \
            --policy "$RUNTIME_POLICY" --check-static
      - name: Download byte-identical runtime attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-first-${{ github.run_id }}
          path: ${{ runner.temp }}/attestation
      - name: Reject spent attempt-3 authority and unauthorized attempt 4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        run: |
          set -euo pipefail
          test "$CAPTURE_AUTHORIZATION_STATUS" = "ATTEMPT_3_SPENT_ATTEMPT_4_UNAUTHORIZED"
          test "$EXPECTED_AUTHORIZATION_INPUT" = "$ACTIVE_AUTHORIZATION_SHA256"
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          "$audit_python" -I -B - "$ATTEMPT_HISTORY" "$AUTHORIZATION" <<'PY'
          import json, sys
          from pathlib import Path
          ledger = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          authority = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert ledger["schema_version"] == "shared-pa-statcast-attempt-history-v3"
          assert [row["attempt_number"] for row in ledger["attempts"]] == [1, 2, 3]
          assert all("PERMANENTLY_CONSUMED" in row["status"] for row in ledger["attempts"])
          assert ledger["remaining_attempts"] == [{"attempt_number": 4, "status": "UNUSED_UNAUTHORIZED"}]
          assert ledger["total_external_statcast_requests"] == 3
          assert ledger["remaining_authorized_attempts"] == 0
          assert ledger["workflow_dispatch_capture_authorized"] is False
          assert authority["schema_version"] == "shared-pa-statcast-attempt-3-authority-package-v1"
          assert authority["status"] == "PREPARED_REQUIRES_EXPLICIT_HUMAN_EXECUTION_APPROVAL"
          assert authority["attempt_number"] == 3
          assert authority["attempt_state"]["attempt_3_status"] == "UNUSED_UNAUTHORIZED_UNTIL_TRANSPORT"
          assert authority["attempt_state"]["attempt_4_status"] == "UNUSED_UNAUTHORIZED"
          raise SystemExit("attempt-3 authorization is spent and attempt 4 is unauthorized")
          PY
      - name: Verify output path is new and invoke authorized_main
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        env:
          EVENT_NAME_LITERAL: ${{ github.event_name }}
          EVENT_MODE_LITERAL: ${{ github.event_name == 'pull_request' && 'preflight' || github.event_name == 'workflow_dispatch' && 'capture' || 'invalid' }}
          DEFAULT_BRANCH_LITERAL: ${{ github.event.repository.default_branch }}
          REF_NAME_LITERAL: ${{ github.ref_name }}
          WORKFLOW_SHA_LITERAL: ${{ github.sha }}
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          output="${EXECUTION_ROOT}/${OUTPUT}"
          work="${output}.work"
          lock="${output}.lock"
          test ! -e "$output"
          test ! -e "$work"
          test ! -e "$lock"
          "$audit_python" -I -B - "$EVENT_NAME_LITERAL" "$EVENT_MODE_LITERAL" \
            "$DEFAULT_BRANCH_LITERAL" "$REF_NAME_LITERAL" "$WORKFLOW_SHA_LITERAL" \
            "$REQUESTED_WORKFLOW_COMMIT" "$REQUEST_PLAN" "$CONTRACT" \
            "$AUTHORIZATION" "$RUNTIME_POLICY" \
            "${RUNNER_TEMP}/attestation/statcast-runtime-first.json" "$output" \
            "$ATTEMPT_HISTORY" <<'PY'
          import hashlib, json, os, socket, sys
          from contextlib import nullcontext
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import scripts.capture_shared_pa_statcast_source_v1 as capture
          from src.evaluation.shared_pa_statcast_historical_source_access_v1 import VerifiedStatcastHistoricalSourceAccess
          (event_name, event_mode, default_branch, ref_name, workflow_sha,
           requested_workflow_commit, plan, contract, authorization, policy,
           attestation, output, attempts) = sys.argv[1:]
          if event_name not in {"pull_request", "workflow_dispatch"}:
              raise SystemExit("unsupported event")
          if event_name == "pull_request" and event_mode != "preflight":
              raise SystemExit("pull_request is preflight-only")
          if event_name == "workflow_dispatch" and event_mode != "capture":
              raise SystemExit("workflow_dispatch is capture-only")
          if event_name == "workflow_dispatch":
              if ref_name != default_branch or requested_workflow_commit != workflow_sha:
                  raise SystemExit("capture requires the exact merged default-branch workflow")
          elif event_name == "pull_request" and event_mode == "capture":
              raise SystemExit("pull_request cannot select capture")
          expected_authorization_sha256 = os.environ["ACTIVE_AUTHORIZATION_SHA256"]
          expected_game_pks = [717255, 717256, 717258, 717259, 717260, 717261, 717262,
                               717263, 717264, 717265, 717266, 717267, 717269, 717270, 717272]
          expected_url = (
              "https://baseballsavant.mlb.com/statcast_search/csv?all=true&batter_stands=&"
              "game_date_gt=2023-07-25&game_date_lt=2023-07-25&group_by=name&hfAB=&hfBBL=&"
              "hfBBT=&hfFlag=&hfGT=R%7C&hfInn=&hfNewZones=&hfOuts=&hfPR=&hfPT=&hfRO=&hfSA=&"
              "hfSea=&hfSit=&hfZ=&home_road=&metric_1=&min_abs=0&min_pitches=0&min_results=0&"
              "opponent=&pitcher_throws=&player_event_sort=h_launch_speed&player_type=pitcher&"
              "position=&sort_col=pitches&sort_order=desc&stadium=&team=&type=details"
          )

          def attempt3_authority_verifier(*, authorization_path, expected_authorization_sha256,
                                          expected_carrier_commit, expected_runtime_policy_sha256,
                                          expected_source_bundle_sha256, expected_source_contract_sha256,
                                          expected_request_plan_sha256, access_time_utc):
              del access_time_utc
              path = Path(authorization_path)
              if not path.is_file() or path.is_symlink():
                  raise capture.CaptureError("attempt-3 authority package is missing or unsafe")
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_authorization_sha256:
                  raise capture.CaptureError("attempt-3 authority package differs from dispatch identity")
              value = json.loads(raw)
              if value.get("schema_version") != "shared-pa-statcast-attempt-3-authority-package-v1":
                  raise capture.CaptureError("attempt-3 authority package schema differs")
              if value.get("status") != "PREPARED_REQUIRES_EXPLICIT_HUMAN_EXECUTION_APPROVAL":
                  raise capture.CaptureError("attempt-3 authority package status differs")
              if value.get("attempt_number") != 3 or value.get("preparation_is_capture_authorization") is not False:
                  raise capture.CaptureError("attempt-3 authority boundary differs")
              workflow = value.get("workflow", {})
              workspace = Path(os.environ["GITHUB_WORKSPACE"])
              workflow_path = workspace / workflow.get("path", "")
              if not workflow_path.is_file() or hashlib.sha256(workflow_path.read_bytes()).hexdigest() != workflow.get("sha256"):
                  raise capture.CaptureError("attempt-3 workflow identity differs")
              if workflow.get("manual_dispatch_count") != 1 or workflow.get("automatic_rerun_allowed") is not False:
                  raise capture.CaptureError("attempt-3 dispatch boundary differs")
              identities = value.get("execution_identities", {})
              expected_identities = {
                  "carrier_commit": expected_carrier_commit,
                  "runtime_attestation_sha256": "903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5",
                  "runtime_policy_sha256": expected_runtime_policy_sha256,
                  "source_contract_sha256": expected_source_contract_sha256,
                  "source_bundle_sha256": expected_source_bundle_sha256,
                  "sample_request_plan_sha256": expected_request_plan_sha256,
              }
              if identities != expected_identities:
                  raise capture.CaptureError("attempt-3 execution identities differ")
              state = value.get("attempt_state", {})
              if state.get("path") != "config/shared_pa_statcast_sample_attempt_history_20260801_v2.json":
                  raise capture.CaptureError("attempt-3 successor ledger path differs")
              if state.get("sha256") != "456787efef26d3d438e1afe13d1eee949cd9866d2f8d0a2c5c74d9928a97572e":
                  raise capture.CaptureError("attempt-3 successor ledger identity differs")
              if (state.get("prior_attempts_consumed"), state.get("remaining_lifetime_attempts"),
                  state.get("total_real_external_statcast_requests")) != (2, 2, 2):
                  raise capture.CaptureError("attempt-3 accounting differs")
              if state.get("attempt_3_status") != "UNUSED_UNAUTHORIZED_UNTIL_TRANSPORT":
                  raise capture.CaptureError("attempt 3 is not the next unused attempt")
              incident = value.get("attempt_2_incident_record", {})
              incident_path = workspace / incident.get("path", "")
              if not incident_path.is_file() or hashlib.sha256(incident_path.read_bytes()).hexdigest() != incident.get("sha256"):
                  raise capture.CaptureError("attempt-2 incident identity differs")
              request = value.get("request", {})
              if (request.get("request_id") != "statcast-2023-07-25" or request.get("method") != "GET"
                  or request.get("endpoint") != "https://baseballsavant.mlb.com/statcast_search/csv"
                  or request.get("url") != expected_url or request.get("official_date") != "2023-07-25"
                  or request.get("certified_game_pks") != expected_game_pks
                  or request.get("external_request_attempts") != 1
                  or request.get("minimum_request_start_interval_seconds") != 1.1
                  or request.get("automatic_http_retries") != 0
                  or request.get("replacement_requests_allowed") is not False):
                  raise capture.CaptureError("attempt-3 request scope differs")
              output_scope = value.get("output", {})
              if (output_scope.get("path") != "data/source/shared_pa_statcast_sample_2023-07-25_attempt-03_v1"
                  or output_scope.get("artifact_name") != "shared-pa-statcast-attempt-03"
                  or output_scope.get("no_overwrite") is not True):
                  raise capture.CaptureError("attempt-3 output identity differs")
              boundaries = value.get("validation_boundaries", {})
              if (boundaries.get("source_contract_modified") is not False
                  or boundaries.get("content_type_allowlist_modified") is not False
                  or boundaries.get("validation_weakening_allowed") is not False):
                  raise capture.CaptureError("attempt-3 validation boundary differs")
              return VerifiedStatcastHistoricalSourceAccess(
                  authorization_id="prepared-attempt-3-requires-explicit-human-execution-approval",
                  authorization_file_sha256=expected_authorization_sha256,
                  carrier_commit=expected_carrier_commit,
                  runtime_policy_sha256=expected_runtime_policy_sha256,
                  source_bundle_sha256=expected_source_bundle_sha256,
                  source_contract_sha256=expected_source_contract_sha256,
                  request_plan_sha256=expected_request_plan_sha256,
                  output_path=output_scope["path"],
                  attempt_history_sha256=state["sha256"],
                  prior_attempts_consumed=2,
                  remaining_lifetime_attempts=2,
              )

          def attempt3_history_validator(path, *, request_id, source_access, maximum_attempts):
              history_path = Path(path)
              if not history_path.is_file() or history_path.is_symlink():
                  raise capture.CaptureError("successor attempt history is missing or unsafe")
              if capture.sha256_file(history_path) != source_access.attempt_history_sha256:
                  raise capture.CaptureError("successor attempt history differs from authority")
              ledger = json.loads(history_path.read_text(encoding="utf-8"))
              if (ledger.get("schema_version") != "shared-pa-statcast-attempt-history-v3"
                  or ledger.get("request_id") != request_id or maximum_attempts != 4
                  or [row.get("attempt_number") for row in ledger.get("attempts", [])] != [1, 2, 3]
                  or not all("PERMANENTLY_CONSUMED" in row.get("status", "") for row in ledger.get("attempts", []))
                  or ledger.get("remaining_attempts") != [
                      {"attempt_number": 4, "status": "UNUSED_UNAUTHORIZED"},
                  ]
                  or ledger.get("consumed_lifetime_attempts") != 3
                  or ledger.get("remaining_lifetime_attempts") != 1
                  or ledger.get("total_external_statcast_requests") != 3
                  or ledger.get("attempt_4_authorized") is not False
                  or ledger.get("attempt_numbering_reset_permitted") is not False
                  or ledger.get("attempt_reuse_permitted") is not False):
                  raise capture.CaptureError("successor attempt history accounting differs")
              return 3

          capture.verify_statcast_historical_source_access = attempt3_authority_verifier
          capture._validate_attempt_history = attempt3_history_validator
          argv = [
              "--request-plan", plan, "--contract", contract,
              "--authorization", authorization,
              "--expected-authorization-sha256",
              expected_authorization_sha256,
              "--runtime-policy", policy, "--runtime-attestation", attestation,
              "--expected-runtime-attestation-sha256",
              "903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5",
              "--expected-source-bundle-sha256",
              "22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1",
              "--carrier-commit", "74395e8552cf65701e526d4cba1f08a3e7f286d8",
              "--output-dir", output, "--attempt-history", attempts,
          ]
          calls = []
          original_transport = capture._transport
          def blocked_transport(full_url, timeout, maximum, *, execution_authorization):
              calls.append({"full_url": full_url, "timeout": timeout, "maximum": maximum})
              raise capture.TransportFailure(
                  error_kind="no_network_execution_preflight", retryable=False,
                  requested_at_utc=capture._utc(), observed_at_utc=capture._utc())
          if event_mode == "preflight":
              capture._transport = blocked_transport
          rc = 1
          command_error_type = None
          try:
              with capture.network_denial_guard() if event_mode == "preflight" else nullcontext():
                  rc = capture.authorized_main(argv)
          except SystemExit as exc:
              rc = int(exc.code) if isinstance(exc.code, int) else 1
              command_error_type = "SystemExit"
          except Exception as exc:
              rc = 1
              command_error_type = type(exc).__name__
          finally:
              capture._transport = original_transport
          if event_mode == "preflight":
              assert rc != 0
              assert calls == [], calls
              assert not Path(output).exists()
              assert not Path(output + ".work").exists()
              assert not Path(output + ".lock").exists()
              with capture.network_denial_guard():
                  try:
                      original_transport(full_url="https://baseballsavant.mlb.com/statcast_search/csv?preflight=blocked", timeout=1.0, maximum=1, execution_authorization=capture.TransportExecutionAuthorization(
                          authorization_sha256=expected_authorization_sha256,
                          runtime_attestation_sha256="903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5",
                          runtime_policy_sha256="31b6b16063bfb0f8e1535d4475259caa10ff548423df793a9d79bd2616f5f9c3",
                          source_bundle_sha256="22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1",
                          source_contract_sha256="7078857cc1815e5c8dcecd667a9b6d69079ef31c1fc68057473d1fb1dc9ceebd",
                          request_plan_sha256="a40abd52a42ed36a49b6fc5d3d91d2202f57e7075a077f8f1abe3252df016994",
                          carrier_commit="74395e8552cf65701e526d4cba1f08a3e7f286d8"))
                  except capture.CaptureError as exc:
                      assert "lower-layer network guard" in str(exc)
                  else:
                      raise AssertionError("lower-level network guard did not block")
              rc = 0
          command_status = {
              "schema_version": "shared-pa-statcast-capture-command-status-v1",
              "status": "SPENT_AUTHORIZATION_REJECTED_BEFORE_TRANSPORT" if event_mode == "preflight" else ("CAPTURE_COMMAND_COMPLETED" if rc == 0 else "CAPTURE_COMMAND_FAILED"),
              "capture_command_exit_code": rc,
              "capture_command_invoked": True,
              "capture_command_error_type": command_error_type,
              "external_statcast_requests": 0 if event_mode == "preflight" else None,
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("capture-command-status.json").write_text(
              json.dumps(command_status, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"]).joinpath("capture-execution-summary.txt").write_text(
              json.dumps({"event": event_name, "mode": event_mode, "authorized_main_invoked": True,
                          "external_statcast_requests": 0 if event_mode == "preflight" else None,
                          "attempts_1_through_3_consumed": True,
                          "attempt_3": "SPENT_REJECTED_BEFORE_TRANSPORT",
                          "attempt_4": "UNUSED_UNAUTHORIZED",
                          "total_real_external_statcast_requests": 3,
                          "status": "SPENT_AUTHORIZATION_REJECTION_PASSED" if event_mode == "preflight" else "CAPTURE_COMMAND_RECORDED"},
                         sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"event": event_name, "mode": event_mode, "authorized_main_invoked": True,
                            "external_statcast_requests": 0 if event_mode == "preflight" else None,
                            "attempts_1_through_3_consumed": True,
                            "attempt_3": "SPENT_REJECTED_BEFORE_TRANSPORT",
                            "attempt_4": "UNUSED_UNAUTHORIZED",
                            "total_real_external_statcast_requests": 3,
                            "status": "SPENT_AUTHORIZATION_REJECTION_PASSED" if event_mode == "preflight" else "CAPTURE_COMMAND_RECORDED"}, sort_keys=True))
          PY
      - name: Verify and finalize capture or quarantined failure package from carrier
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          capture_root="${EXECUTION_ROOT}/${OUTPUT}"
          command_status="${RUNNER_TEMP}/capture-command-status.json"
          observation="${RUNNER_TEMP}/capture-observation.json"
          failure_package="${RUNNER_TEMP}/capture-failure-package"
          mkdir -p "$failure_package"
          if [ ! -f "$command_status" ]; then
            "$audit_python" -I -B - "$command_status" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "schema_version": "shared-pa-statcast-capture-command-status-v1",
              "status": "CAPTURE_COMMAND_STATUS_NOT_RETAINED",
              "capture_command_exit_code": 99,
              "capture_command_invoked": None,
              "capture_command_error_type": None,
              "external_statcast_requests": None,
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          fi
          "$audit_python" -I -B - "$capture_root" "$observation" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest_path = root / "manifest.json"
          result = {
              "capture_root_exists": root.is_dir(),
              "manifest_retained": manifest_path.is_file(),
              "observed_capture_digest": None,
              "success_count": None,
              "failure_count": None,
              "capture_validation_exit_code": 1,
          }
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              result.update({
                  "observed_capture_digest": manifest.get("observed_capture_digest"),
                  "success_count": manifest.get("success_count"),
                  "failure_count": manifest.get("failure_count"),
              })
              if manifest.get("success_count") == 1 and manifest.get("failure_count") == 0:
                  result["capture_validation_exit_code"] = 0
          Path(sys.argv[2]).write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          capture_rc="$("$audit_python" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["capture_command_exit_code"])' "$command_status")"
          validation_rc="$("$audit_python" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["capture_validation_exit_code"])' "$observation")"
          expected_digest="$("$audit_python" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("observed_capture_digest") or "")' "$observation")"
          native_verifier_rc=97
          verifier_rc=97
          if [ -n "$expected_digest" ] && [ -d "$capture_root" ]; then
            set +e
            "$audit_python" -I -B scripts/verify_shared_pa_statcast_capture_v1.py \
              --capture "$capture_root" \
              --request-plan "$REQUEST_PLAN" \
              --contract "$CONTRACT" \
              --expected-capture-digest "$expected_digest" \
              > "${failure_package}/carrier-verifier.stdout.txt" \
              2> "${failure_package}/carrier-verifier.stderr.txt"
            native_verifier_rc=$?
            verifier_rc=$native_verifier_rc
            set -e
          else
            printf '%s\n' "carrier verifier not invoked because no capture manifest was retained" \
              > "${failure_package}/carrier-verifier.stderr.txt"
          fi
          printf '%s\n' "$capture_rc" > "${failure_package}/capture-command-exit-code.txt"
          printf '%s\n' "$validation_rc" > "${failure_package}/capture-validation-exit-code.txt"
          printf '%s\n' "$native_verifier_rc" > "${failure_package}/carrier-native-verifier-exit-code.txt"
          printf '%s\n' "$verifier_rc" > "${failure_package}/carrier-verifier-exit-code.txt"
          "$audit_python" -I -B - "$command_status" "$observation" "$capture_root" \
            "$capture_rc" "$validation_rc" "$verifier_rc" "${failure_package}/failure-package.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          command = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          observation = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          capture_root = Path(sys.argv[3])
          capture_rc, validation_rc, verifier_rc = map(int, sys.argv[4:7])
          output = Path(sys.argv[7])
          retained_paths = sorted(
              path.relative_to(capture_root).as_posix()
              for path in capture_root.rglob("*")
              if path.is_file()
          ) if capture_root.is_dir() else []
          raw_paths = [path for path in retained_paths if "/response-attempt-" in "/" + path]
          result_paths = [capture_root / path for path in retained_paths if "/result-" in "/" + path]
          safe_headers_retained = False
          raw_content_types = []
          normalized_mime_types = []
          for path in result_paths:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              headers = value.get("response_headers")
              safe_headers_retained = safe_headers_retained or isinstance(headers, dict)
              if isinstance(headers, dict) and isinstance(headers.get("content-type"), str):
                  raw_content_types.append(headers["content-type"])
                  normalized_mime_types.append(headers["content-type"].split(";", 1)[0].strip().lower())
          reservation_paths = [path for path in retained_paths if "/reservation-" in "/" + path]
          request_start_timestamp_retained = False
          for relative in reservation_paths:
              try:
                  value = json.loads((capture_root / relative).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              request_start_timestamp_retained = request_start_timestamp_retained or isinstance(
                  value.get("request_started_at_utc"), str
              )
          is_failure = capture_rc != 0 or validation_rc != 0 or verifier_rc != 0
          package = {
              "schema_version": "shared-pa-statcast-capture-failure-package-v1",
              "status": "CAPTURE_QUARANTINED" if is_failure else "CAPTURE_VERIFIED_AWAITING_SEPARATE_SOURCE_QUALIFICATION",
              "invalid": is_failure,
              "quarantined": is_failure,
              "non_promotable": is_failure,
              "source_qualified": False,
              "upload_is_source_qualification": False,
              "capture_command_exit_code": capture_rc,
              "capture_validation_exit_code": validation_rc,
              "carrier_verifier_exit_code": verifier_rc,
              "carrier_native_verifier_exit_code": int((Path(sys.argv[7]).parent / "carrier-native-verifier-exit-code.txt").read_text()),
              "terminal_workflow_status_after_publication": "FAILURE" if is_failure else "SUCCESS",
              "command_status": command,
              "capture_observation": observation,
              "retained_capture_paths": retained_paths,
              "raw_bytes_retained": bool(raw_paths),
              "safe_response_headers_retained": safe_headers_retained,
              "raw_content_types_retained": raw_content_types,
              "normalized_mime_types_retained": normalized_mime_types,
              "content_type_retention_status": "RETAINED" if raw_content_types else "NOT_RETAINED",
              "request_start_timestamp_retained": request_start_timestamp_retained,
              "attempt_journal_retained": bool(reservation_paths),
              "runtime_identities": {
