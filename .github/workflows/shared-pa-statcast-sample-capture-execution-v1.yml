name: Shared PA Statcast bounded sample capture (execution)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_workflow_commit_sha:
        description: "Exact commit containing this workflow"
        required: true
        type: string
      expected_runtime_attestation_sha256:
        description: "Expected two-pass clean-Linux runtime attestation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-pa-statcast-sample-capture-execution
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  CARRIER_COMMIT: 74395e8552cf65701e526d4cba1f08a3e7f286d8
  RUNTIME_POLICY: config/shared_pa_statcast_runtime_authority_v1.json
  REQUEST_PLAN: config/shared_pa_statcast_source_preparation_v1/sample_request_plan.json
  CONTRACT: config/shared_pa_statcast_source_contract_v1.json
  AUTHORIZATION: config/shared_pa_statcast_historical_source_access_authorization_20260731_v1.json
  ATTEMPT_HISTORY: config/shared_pa_statcast_sample_attempt_history_20260731_v1.json
  OUTPUT: data/source/shared_pa_statcast_sample_2023-07-25_v1
  EXPECTED_RUNTIME_POLICY_SHA256: 31b6b16063bfb0f8e1535d4475259caa10ff548423df793a9d79bd2616f5f9c3
  EXPECTED_SOURCE_CONTRACT_SHA256: 7078857cc1815e5c8dcecd667a9b6d69079ef31c1fc68057473d1fb1dc9ceebd
  EXPECTED_SOURCE_BUNDLE_SHA256: 22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1
  EXPECTED_REQUEST_PLAN_SHA256: a40abd52a42ed36a49b6fc5d3d91d2202f57e7075a077f8f1abe3252df016994
  EXPECTED_AUTHORIZATION_SHA256: 11c19c423404f7e75b8308dc6feea818808af166b64ce7abc7140bc0f6e8425f
  EXPECTED_RUNTIME_ATTESTATION_SHA256: 903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5
  EXPECTED_ATTEMPT_HISTORY_SHA256: eb28fbfc18ba777f796abe1db9735579f99a06907d5de856d696d4de5db0aaf5
  EVENT_NAME: ${{ github.event_name }}
  EVENT_MODE: ${{ github.event_name == 'pull_request' && 'preflight' || github.event_name == 'workflow_dispatch' && 'capture' || 'invalid' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  REQUESTED_WORKFLOW_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_workflow_commit_sha }}
  EXPECTED_RUNTIME_INPUT: ${{ github.event_name == 'pull_request' && '903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5' || inputs.expected_runtime_attestation_sha256 }}

jobs:
  workflow-contract:
    name: Validate immutable event-mode separation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the workflow commit under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REQUESTED_WORKFLOW_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run static event and mutation checks
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - .github/workflows/shared-pa-statcast-sample-capture-execution-v1.yml <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          original = path.read_text(encoding="utf-8")

          def validate(text: str) -> None:
              required = (
                  "pull_request:\n    branches:",
                  "workflow_dispatch:\n    inputs:",
                  "EVENT_MODE:",
                  "github.event_name == 'pull_request' && 'preflight'",
                  "github.event_name == 'workflow_dispatch' && 'capture'",
                  'if event_name not in {"pull_request", "workflow_dispatch"}:',
                  'if event_name == "pull_request" and event_mode != "preflight":',
                  'if event_name == "workflow_dispatch" and event_mode != "capture":',
                  'capture._transport = blocked_transport',
                  'with capture.network_denial_guard()',
                  'rc = capture.authorized_main(argv)',
                  'reservation-02.json',
                  '"prior_attempt_count"] == 1',
                  '"remaining_attempts": 3',
                  '--expected-authorization-sha256',
                  '--expected-runtime-attestation-sha256',
                  '--expected-source-bundle-sha256',
                  'test ! -e "$output"',
                  'test ! -e "$work"',
                  'test ! -e "$lock"',
              )
              missing = [needle for needle in required if needle not in text]
              if missing:
                  raise AssertionError(f"event-separation contract missing: {missing}")
              mode_input = "inputs" + ".mode"
              mode_indent = (" " * 6) + "mode:"
              if mode_indent in text or mode_input in text:
                  raise AssertionError("pull_request must have no mode input or mode override")
              expression_prefix = "if: " + chr(36) + "{{ "
              if (expression_prefix + mode_input + " == 'capture }}") in text:
                  raise AssertionError("capture must be selected by event, never by an input")
              if text.count("with capture.network_denial_guard()") < 2:
                  raise AssertionError("application and lower-level network guards are both required")

          validate(original)
          mutations = {
              "pull_request_guard_removed": original.replace("  pull_request:\n    branches:\n      - main\n", "", 1),
              "event_name_changed": original.replace("github.event_name == 'pull_request'", "github.event_name_tampered == 'pull_request'"),
              "preflight_condition_weakened": original.replace('event_mode != "preflight"', 'event_mode != "capture"'),
              "lower_guard_removed": original.replace('with capture.network_denial_guard()', 'with nullcontext()'),
              "blocking_transport_removed": original.replace('blocked_transport', 'original_transport'),
              "authorization_gate_removed": original.replace('--expected-authorization-sha256', '--authorization-gate-removed'),
              "attempt_history_removed": original.replace('reservation-02.json', 'reservation-99.json'),
              "workflow_input_added": original.replace(
                  (" " * 6) + "expected_workflow_commit_sha:",
                  (" " * 6) + "mode: capture" + chr(10) + (" " * 6) + "expected_workflow_commit_sha:",
                  1),
              "attempt_one_reset": original.replace('"prior_attempt_count"] == 1', '"prior_attempt_count"] == 0'),
          }
          for name, mutated in mutations.items():
              try:
                  validate(mutated)
              except AssertionError:
                  continue
              raise AssertionError(f"mutation was not rejected: {name}")
          print("EVENT_MODE_STATIC_CHECK=PASS")
          print("EVENT_MODE_MUTATION_CHECKS=PASS")
          PY

  independent-attestation:
    name: Clean-Linux attestation (${{ matrix.pass }})
    strategy:
      fail-fast: false
      matrix:
        pass: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CARRIER_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove carrier identity and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CARRIER_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
      - name: Install exact hash-locked runtime
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          python -m venv --without-pip "${RUNNER_TEMP}/statcast-runtime-env"
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" install \
            --disable-pip-version-check --no-compile --no-deps --require-hashes \
            -r requirements-direct-batter-pa-source-authority.lock
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" check
      - name: Run static checks and regenerate runtime attestation
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          "$audit_python" -I -B scripts/verify_direct_batter_pa_source_runtime_authority.py \
            --policy "$RUNTIME_POLICY" --check-static
          attestation="${RUNNER_TEMP}/statcast-runtime-${{ matrix.pass }}.json"
          "$audit_python" -I -B - "$RUNTIME_POLICY" "$attestation" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import scripts.capture_shared_pa_statcast_source_v1
          from scripts.verify_direct_batter_pa_source_runtime_authority import (
              canonical_json_bytes, linux_runtime_attestation, load_policy,
          )
          policy = load_policy(Path(sys.argv[1]))
          Path(sys.argv[2]).write_bytes(canonical_json_bytes(linux_runtime_attestation(policy)))
          PY
          observed="$(sha256sum "$attestation" | awk '{print $1}')"
          test "$EXPECTED_RUNTIME_INPUT" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          test "$observed" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          printf '%s  %s\n' "$observed" "$attestation" > "${RUNNER_TEMP}/statcast-runtime-${{ matrix.pass }}.sha256"
      - name: Upload attestation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-sample-runtime-${{ matrix.pass }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/statcast-runtime-${{ matrix.pass }}.json
            ${{ runner.temp }}/statcast-runtime-${{ matrix.pass }}.sha256
          if-no-files-found: error
          retention-days: 90

  attestation-equality:
    name: Verify independent runtime-attestation equality
    needs: independent-attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download first attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-first-${{ github.run_id }}
          path: ${{ runner.temp }}/first
      - name: Download second attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-second-${{ github.run_id }}
          path: ${{ runner.temp }}/second
      - name: Compare byte identities
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent "${RUNNER_TEMP}/first/statcast-runtime-first.json" "${RUNNER_TEMP}/second/statcast-runtime-second.json"
          observed="$(sha256sum "${RUNNER_TEMP}/first/statcast-runtime-first.json" | awk '{print $1}')"
          test "$EXPECTED_RUNTIME_INPUT" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          test "$observed" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
          printf '%s\n' "$observed" > "${RUNNER_TEMP}/statcast-runtime-equality.txt"
      - name: Upload equality evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-sample-runtime-equality-${{ github.run_id }}
          path: ${{ runner.temp }}/statcast-runtime-equality.txt
          if-no-files-found: error
          retention-days: 90

  execute-authorized-main:
    name: Execute authorized_main (${{ github.event_name }})
    needs: attestation-equality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.REQUESTED_WORKFLOW_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove workflow and carrier identities
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$EVENT_MODE" in
            pull_request:preflight) ;;
            workflow_dispatch:capture) ;;
            *) echo "event/mode mismatch" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
            test "$REQUESTED_WORKFLOW_COMMIT" = "$GITHUB_SHA"
            test -n "${{ inputs.expected_workflow_commit_sha }}"
            test -n "${{ inputs.expected_runtime_attestation_sha256 }}"
          else
            test "$EVENT_NAME" = "pull_request"
            test "$EVENT_MODE" = "preflight"
          fi
          test "$(git rev-parse HEAD)" = "$REQUESTED_WORKFLOW_COMMIT"
          test "$(git rev-parse "$CARRIER_COMMIT^{commit}")" = "$CARRIER_COMMIT"
          execution_root="${RUNNER_TEMP}/statcast-carrier-exec"
          git worktree add --detach "$execution_root" "$CARRIER_COMMIT"
          for bound in "$RUNTIME_POLICY" "$REQUEST_PLAN" "$CONTRACT" "$AUTHORIZATION" "$ATTEMPT_HISTORY"; do
            target="$execution_root/$bound"
            mkdir -p "$(dirname "$target")"
            cp -- "$GITHUB_WORKSPACE/$bound" "$target"
          done
          test "$(git -C "$execution_root" rev-parse HEAD)" = "$CARRIER_COMMIT"
          for bound in "$RUNTIME_POLICY" "$REQUEST_PLAN" "$CONTRACT" "$AUTHORIZATION" "$ATTEMPT_HISTORY"; do
            test -f "$execution_root/$bound"
          done
          printf 'EXECUTION_ROOT=%s\n' "$execution_root" >> "$GITHUB_ENV"
          printf '%s\n' "$REQUESTED_WORKFLOW_COMMIT" > "${RUNNER_TEMP}/workflow-commit.txt"
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: x64
      - name: Install exact hash-locked runtime
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          python -m venv --without-pip "${RUNNER_TEMP}/statcast-runtime-env"
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" install \
            --disable-pip-version-check --no-compile --no-deps --require-hashes \
            -r requirements-direct-batter-pa-source-authority.lock
          python -m pip --python "${RUNNER_TEMP}/statcast-runtime-env/bin/python" check
      - name: Verify every bound identity and incident accounting
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          for pair in \
            "$EXPECTED_RUNTIME_POLICY_SHA256  $RUNTIME_POLICY" \
            "$EXPECTED_SOURCE_CONTRACT_SHA256  $CONTRACT" \
            "$EXPECTED_REQUEST_PLAN_SHA256  $REQUEST_PLAN" \
            "$EXPECTED_AUTHORIZATION_SHA256  $AUTHORIZATION" \
            "$EXPECTED_ATTEMPT_HISTORY_SHA256  $ATTEMPT_HISTORY"; do
            printf '%s\n' "$pair" | sha256sum -c -
          done
          observed_bundle="$("$audit_python" -I -B -c 'import sys; sys.path.insert(0, "."); from scripts.capture_shared_pa_statcast_source_v1 import source_bundle_sha256; print(source_bundle_sha256())')"
          test "$observed_bundle" = "$EXPECTED_SOURCE_BUNDLE_SHA256"
          "$audit_python" -I -B - "$ATTEMPT_HISTORY" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["request_id"] == "statcast-2023-07-25"
          assert p["attempt_number"] == 1
          assert p["status"] == "UNAUTHORIZED_QUARANTINED"
          assert p["promoted_to_source_release"] is False
          assert p["parsed_for_modeling"] is False
          assert p["retained_as_authoritative_source"] is False
          assert p["remaining_lifetime_attempts"] == 3
          assert p["request_timestamp_utc"] is None
          PY
          "$audit_python" -I -B scripts/verify_direct_batter_pa_source_runtime_authority.py \
            --policy "$RUNTIME_POLICY" --check-static
      - name: Download byte-identical runtime attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-pa-statcast-sample-runtime-first-${{ github.run_id }}
          path: ${{ runner.temp }}/attestation
      - name: Verify output path is new and invoke authorized_main
        shell: bash
        working-directory: ${{ runner.temp }}/statcast-carrier-exec
        env:
          EVENT_NAME_LITERAL: ${{ github.event_name }}
          EVENT_MODE_LITERAL: ${{ github.event_name == 'pull_request' && 'preflight' || github.event_name == 'workflow_dispatch' && 'capture' || 'invalid' }}
          DEFAULT_BRANCH_LITERAL: ${{ github.event.repository.default_branch }}
          REF_NAME_LITERAL: ${{ github.ref_name }}
          WORKFLOW_SHA_LITERAL: ${{ github.sha }}
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          output="${GITHUB_WORKSPACE}/${OUTPUT}"
          work="${output}.work"
          lock="${output}.lock"
          test ! -e "$output"
          test ! -e "$work"
          test ! -e "$lock"
          "$audit_python" -I -B - "$EVENT_NAME_LITERAL" "$EVENT_MODE_LITERAL" \
            "$DEFAULT_BRANCH_LITERAL" "$REF_NAME_LITERAL" "$WORKFLOW_SHA_LITERAL" \
            "$REQUESTED_WORKFLOW_COMMIT" "$REQUEST_PLAN" "$CONTRACT" \
            "$AUTHORIZATION" "$RUNTIME_POLICY" \
            "${RUNNER_TEMP}/attestation/statcast-runtime-first.json" "$output" \
            "$ATTEMPT_HISTORY" <<'PY'
          import json, os, socket, sys
          from contextlib import nullcontext
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          import scripts.capture_shared_pa_statcast_source_v1 as capture
          (event_name, event_mode, default_branch, ref_name, workflow_sha,
           requested_workflow_commit, plan, contract, authorization, policy,
           attestation, output, attempts) = sys.argv[1:]
          if event_name not in {"pull_request", "workflow_dispatch"}:
              raise SystemExit("unsupported event")
          if event_name == "pull_request" and event_mode != "preflight":
              raise SystemExit("pull_request is preflight-only")
          if event_name == "workflow_dispatch" and event_mode != "capture":
              raise SystemExit("workflow_dispatch is capture-only")
          if event_name == "workflow_dispatch":
              if ref_name != default_branch or requested_workflow_commit != workflow_sha:
                  raise SystemExit("capture requires the exact merged default-branch workflow")
          elif event_name == "pull_request" and event_mode == "capture":
              raise SystemExit("pull_request cannot select capture")
          argv = [
              "--request-plan", plan, "--contract", contract,
              "--authorization", authorization,
              "--expected-authorization-sha256",
              "11c19c423404f7e75b8308dc6feea818808af166b64ce7abc7140bc0f6e8425f",
              "--runtime-policy", policy, "--runtime-attestation", attestation,
              "--expected-runtime-attestation-sha256",
              "903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5",
              "--expected-source-bundle-sha256",
              "22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1",
              "--carrier-commit", "74395e8552cf65701e526d4cba1f08a3e7f286d8",
              "--output-dir", output, "--attempt-history", attempts,
          ]
          calls = []
          original_transport = capture._transport
          def blocked_transport(full_url, timeout, maximum, *, execution_authorization):
              calls.append({"full_url": full_url, "timeout": timeout, "maximum": maximum})
              raise capture.TransportFailure(
                  error_kind="no_network_execution_preflight", retryable=False,
                  requested_at_utc=capture._utc(), observed_at_utc=capture._utc())
          if event_mode == "preflight":
              capture._transport = blocked_transport
          try:
              with capture.network_denial_guard() if event_mode == "preflight" else nullcontext():
                  rc = capture.authorized_main(argv)
          finally:
              capture._transport = original_transport
          if rc != 0:
              raise SystemExit(rc)
          if event_mode == "preflight":
              assert len(calls) == 1, calls
              assert calls[0]["full_url"].startswith("https://baseballsavant.mlb.com/statcast_search/csv?")
              manifest = json.loads((Path(output) / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["prior_attempt_count"] == 1
              assert manifest["success_count"] == 0 and manifest["failure_count"] == 1
              request_dir = Path(output) / "statcast-2023-07-25"
              reservation = json.loads((request_dir / "reservation-02.json").read_text(encoding="utf-8"))
              assert reservation["attempt"] == 2
              assert not list(request_dir.glob("response*"))
              with capture.network_denial_guard():
                  try:
                      original_transport(full_url="https://baseballsavant.mlb.com/statcast_search/csv?preflight=blocked", timeout=1.0, maximum=1, execution_authorization=capture.TransportExecutionAuthorization(
                          authorization_sha256="11c19c423404f7e75b8308dc6feea818808af166b64ce7abc7140bc0f6e8425f",
                          runtime_attestation_sha256="903e566a99d048a575dbe075378fd8b80ace92bf5028c6ddcbb0d200fe509ae5",
                          runtime_policy_sha256="31b6b16063bfb0f8e1535d4475259caa10ff548423df793a9d79bd2616f5f9c3",
                          source_bundle_sha256="22a36802fb7530cc21fb0f38a7c6e85422088de25f435916cf3b53f74d7367a1",
                          source_contract_sha256="7078857cc1815e5c8dcecd667a9b6d69079ef31c1fc68057473d1fb1dc9ceebd",
                          request_plan_sha256="a40abd52a42ed36a49b6fc5d3d91d2202f57e7075a077f8f1abe3252df016994",
                          carrier_commit="74395e8552cf65701e526d4cba1f08a3e7f286d8")))
                  except capture.CaptureError as exc:
                      assert "lower-layer network guard" in str(exc)
                  else:
                      raise AssertionError("lower-level network guard did not block")
          Path(os.environ["RUNNER_TEMP"]).joinpath("capture-execution-summary.txt").write_text(
              json.dumps({"event": event_name, "mode": event_mode, "authorized_main_invoked": True,
                          "external_statcast_requests": 0 if event_mode == "preflight" else None,
                          "attempt_1_consumed": True, "remaining_attempts": 3,
                          "status": "PRECHECK_PASSED" if event_mode == "preflight" else "CAPTURE_COMPLETED"},
                         sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"event": event_name, "mode": event_mode, "authorized_main_invoked": True,
                            "external_statcast_requests": 0 if event_mode == "preflight" else None,
                            "attempt_1_consumed": True,
                            "remaining_attempts": 3,
                            "status": "PRECHECK_PASSED" if event_mode == "preflight" else "CAPTURE_COMPLETED"}, sort_keys=True))
          PY
      - name: Verify and summarize captured package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          audit_python="${RUNNER_TEMP}/statcast-runtime-env/bin/python"
          "$audit_python" -I -B scripts/verify_shared_pa_statcast_capture_v1.py \
            --capture "$OUTPUT" --request-plan "$REQUEST_PLAN" --contract "$CONTRACT" \
            --authorization "$AUTHORIZATION" --attempt-history "$ATTEMPT_HISTORY" \
            --expected-authorization-sha256 "$EXPECTED_AUTHORIZATION_SHA256" \
            --expected-runtime-attestation-sha256 "$EXPECTED_RUNTIME_ATTESTATION_SHA256" \
            --expected-source-bundle-sha256 "$EXPECTED_SOURCE_BUNDLE_SHA256" \
            --expected-carrier-commit "$CARRIER_COMMIT"
          printf '%s\n' "mode=capture" "external_scope=one_bounded_statcast_request" \
            "output=$OUTPUT" > "${RUNNER_TEMP}/capture-execution-summary.txt"
      - name: Upload immutable execution package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-pa-statcast-sample-capture-${{ github.event_name }}-${{ github.run_id }}
          path: |
