name: Shared PA Projected Opportunity Linux Gate

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/shared-pa-projected-opportunity-linux.yml"
      - "requirements-prospective-batter-opportunity-ci.lock"
      - "config/shared_pa_projected_opportunity_forward_v1.json"
      - "reports/shared_pa_projected_opportunity_candidate_v1_hash_manifest.json"
      - "src/data/odds/base.py"
      - "src/evaluation/live_market_identity.py"
      - "src/evaluation/market_economics.py"
      - "src/evaluation/shadow_ledger.py"
      - "src/evaluation/shared_pa_batter_skill.py"
      - "src/evaluation/shared_pa_projected_opportunity_candidate.py"
      - "src/evaluation/shared_pa_projected_opportunity_runner.py"
      - "tests/test_market_economics_properties.py"
      - "tests/test_shared_pa_projected_opportunity_candidate.py"
      - "tests/test_shared_pa_projected_opportunity_runner.py"
      - "tests/test_strict_american_odds_boundary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-candidate:
    name: Ubuntu 24.04 / CPython 3.12.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/baseball-hypothesis
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: "x64"

      - name: Install exact test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r requirements-prospective-batter-opportunity-ci.lock
          python -m pip check
          python --version
          python -m pytest --version
          sha256sum requirements-prospective-batter-opportunity-ci.lock

      - name: Validate bound protocol and candidate tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_shared_pa_projected_opportunity_candidate.py \
            tests/test_shared_pa_projected_opportunity_runner.py \
            tests/test_strict_american_odds_boundary.py \
            tests/test_market_economics_properties.py

      - name: Verify tracked source contains no likely credentials
        run: python scripts/check_tracked_secrets.py

      - name: Prove tests did not mutate tracked bytes
        run: git diff --exit-code
