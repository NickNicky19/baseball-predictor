name: Daily Prediction Archive
on:
  schedule:
    # Best-effort early daily prediction archive. This is NOT the primary T-4h
    # market collector: one fixed time cannot be four hours before every
    # staggered first pitch, and GitHub cron does not provide a hard execution
    # guarantee. The future external shadow collector owns per-game timing;
    # this workflow preserves model-side evidence and provides a durable backup.
    # Run before ordinary North American daytime first pitches. The strict
    # whole-slate boundary in run_slate.py remains authoritative if GitHub
    # dispatch is delayed or a special early game makes this unsafe.
    - cron: "0 12 * * *"   # 12:00 UTC = 08:00 EDT / 07:00 EST
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Leave blank to use today's date."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: daily-predictions
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve slate date (US Eastern)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "slate=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "slate=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # ONE call generates EVERY graded category (hits, hrr, home_runs +
      # pitcher strikeouts), exactly like the GUI's "Run all categories".
      # run_slate.py triggers the automatic rich JSON archive at
      # data/learning/predictions/predictions_<date>.json (with per-row
      # simulation blocks). Do NOT swap this back to run_daily.py: that CLI
      # is single-category (default hrr) and drops the simulation data.
      # It also persists the consumed feature bundles plus their manifest. That
      # evidence is committed below so factual fallback/input-health rates can
      # be audited later. No prediction math changes when it is saved.
      #
      # The MLB client now retries 429/5xx with exponential backoff at the
      # transport layer (mlb_api._build_session), so the transient timeout that
      # killed the 2026-07-10 run no longer kills the job. This step can still
      # fail if the API is genuinely down — see the commit step below.
      - name: Generate predictions (all categories)
        id: predict
        env:
          PYTHONPATH: .
        run: |
          python run_slate.py --date "${{ steps.date.outputs.slate }}" --config config/config.kbb.json

      # if: always() — RUN EVEN IF THE PREDICT STEP FAILED.
      #
      # This is the fix for a real, silent data-loss path. `git add
      # data/learning/predictions/` already sweeps the WHOLE directory, so it
      # picks up any archive that exists but was never committed — including
      # one written by a previous run whose push failed. But none of that
      # helps if the step never RUNS: when run_slate.py exited non-zero the
      # job aborted, the commit step was skipped, and any archive already
      # written on the runner was thrown away with the container.
      #
      # With always(), a partial archive still reaches the repo.  The next
      # day's forward-only settlement job may grade it only if it is the
      # immediately preceding official date; it will never backfill an older
      # missed prospective record.
      # The job's overall status still reflects the predict failure (the step
      # itself is not masked), so a genuine outage is still visible/emailed.
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The rich per-date archive plus the exact persisted feature bundles.
          # Do not commit an archive while discarding the feature provenance
          # needed to audit its input-health labels later.
          git add data/learning/predictions/ data/features/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Predictions for ${{ steps.date.outputs.slate }} [skip ci]"
            git push
          fi

      # Surface a failed prediction run AFTER the archives are safely committed,
      # so the job goes red (and emails) without costing us the data.
      - name: Fail the job if prediction failed
        if: always() && steps.predict.outcome == 'failure'
        run: |
          echo "run_slate.py failed for ${{ steps.date.outputs.slate }}."
          echo "Any archive already written has been committed above; the"
          echo "The next day's forward-only settlement job may grade an existing archive."
          echo "If no archive was written, this slate is permanently missing."
          exit 1
