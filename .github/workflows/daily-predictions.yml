name: Daily Predictions

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slate date (US Eastern)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "slate=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "slate=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate predictions
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/predictions
          python run_daily.py \
            --date "${{ steps.date.outputs.slate }}" \
            --format all \
            --output "data/predictions/preds_${{ steps.date.outputs.slate }}.csv"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions data/learning/predictions || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Predictions for ${{ steps.date.outputs.slate }} [skip ci]"
            git push
          fi
