name: Daily Predictions

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 4:00 PM Eastern (good time for confirmed lineups)
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD). Leave blank to use today's date."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slate date (US Eastern)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "slate=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "slate=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # ONE call generates EVERY graded category (hits, hrr, home_runs +
      # pitcher strikeouts), exactly like the GUI's "Run all categories".
      # run_slate.py triggers the automatic rich JSON archive at
      # data/learning/predictions/predictions_<date>.json (with per-row
      # simulation blocks). Do NOT swap this back to run_daily.py: that CLI
      # is single-category (default hrr) and drops the simulation data.
      - name: Generate predictions (all categories)
        env:
          PYTHONPATH: .
        run: |
          python run_slate.py --date "${{ steps.date.outputs.slate }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The rich per-date archive the outcome recorder later grades.
          git add data/learning/predictions/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Predictions for ${{ steps.date.outputs.slate }} [skip ci]"
            git push
          fi
