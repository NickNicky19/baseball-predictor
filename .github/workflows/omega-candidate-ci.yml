name: Omega Candidate CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-candidate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Isolated candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse production, evidence, or sealed-month path changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRTD "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/omega_changed_paths.txt"
          forbidden='^(deploy/|\.github/workflows/(daily-predictions|record-outcomes|weekly-validation|forward-shadow-preflight|pitcher-receipt-verifier|shared-pa-forward-verifier|shadow-evidence-verifier)\.yml$|(.*\/)?(data|predictions|outcomes|receipts)(/|$)|.*2026[-_/]?0?5.*)'
          if grep -Eiq "$forbidden" "$RUNNER_TEMP/omega_changed_paths.txt"; then
            echo 'Candidate PR changes a protected production, evidence, outcome, receipt, or sealed-month path.' >&2
            grep -Ein "$forbidden" "$RUNNER_TEMP/omega_changed_paths.txt" >&2
            exit 1
          fi

      - name: Verify frozen production boundary
        run: python infra/omega_staging/verify_production_boundary.py

      - name: Require reviewed hash locks
        shell: bash
        run: |
          set -euo pipefail
          for lock in requirements/profiles/dashboard.lock requirements/profiles/test.lock; do
            test -s "$lock" || {
              echo "Missing reviewed CPython 3.12/Linux hash lock: $lock" >&2
              exit 1
            }
            grep -q -- '--hash=sha256:' "$lock" || {
              echo "Lock has no package hashes: $lock" >&2
              exit 1
            }
          done

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements/profiles/test.lock

      - name: Install exact test environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/profiles/test.lock
          python -m pip check

      - name: Verify candidate state and tracked secrets
        shell: bash
        run: |
          python scripts/check_tracked_secrets.py
          PYTHONPATH=. python scripts/verify_omega_candidate_boundaries.py
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('config/omega_candidate_v0.json').read_text(encoding='utf-8'))
          expected = {
              'active': False,
              'betting_authorized': False,
              'fits_model': False,
              'changes_production_probabilities': False,
              'collector_changes_permitted': False,
              'may_2026_permitted': False,
          }
          failures = [key for key, value in expected.items() if state.get(key) is not value]
          if state.get('qualification_state') != 'IMPLEMENTED_UNQUALIFIED':
              failures.append('qualification_state')
          if state.get('promotion_approval_sha256') is not None:
              failures.append('promotion_approval_sha256')
          if failures:
              raise SystemExit(f"candidate state is not fail-closed: {sorted(set(failures))}")
          print('candidate state verified: implemented, unqualified, inactive')
          PY

      - name: Compile isolated candidate modules
        run: python -m compileall -q dashboard src/omega_contracts infra/omega_staging

      - name: Run isolated candidate tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(tests/omega_contracts)
          test -d tests/dashboard && targets+=(tests/dashboard)
          test -d tests/omega_dashboard && targets+=(tests/omega_dashboard)
          for candidate in tests/test_omega_*.py tests/test_dashboard*.py; do
            targets+=("$candidate")
          done
          python -m pytest -q "${targets[@]}"

      - name: Build read-only dashboard image
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag omega-dashboard-ci:"$GITHUB_SHA" .
