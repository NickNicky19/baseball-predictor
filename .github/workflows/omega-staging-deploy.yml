name: Deploy Omega Staging

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit already merged into main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: omega-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Exact-commit private staging deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: omega-staging
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      AWS_ACCOUNT_ID: ${{ vars.OMEGA_STAGING_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.OMEGA_STAGING_AWS_REGION }}
      BUDGET_NAME: ${{ vars.OMEGA_STAGING_BUDGET_NAME }}
      FOUNDATION_STACK: ${{ vars.OMEGA_STAGING_FOUNDATION_STACK }}
      SERVICE_STACK: ${{ vars.OMEGA_STAGING_SERVICE_STACK }}
      REPOSITORY_NAME: baseball-predictor-omega-staging
      SERVICE_NAME: baseball-predictor-omega-staging
    steps:
      - name: Validate structural inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be an exact lowercase commit SHA' >&2; exit 1; }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'AWS account variable is absent or invalid' >&2; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo 'AWS region variable is absent or invalid' >&2; exit 1; }
          test -n "$BUDGET_NAME" || { echo 'AWS budget name is required' >&2; exit 1; }
          test "$FOUNDATION_STACK" = 'baseball-predictor-omega-staging-foundation'
          test "$SERVICE_STACK" = 'baseball-predictor-omega-staging-service'

      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit is on main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main || {
            echo 'Refusing to deploy a commit that is not contained in origin/main' >&2
            exit 1
          }

      - name: Verify source boundary and locks
        shell: bash
        run: |
          set -euo pipefail
          python infra/omega_staging/verify_production_boundary.py
          for lock in requirements/profiles/scaffold-runtime.lock requirements/profiles/scaffold-test.lock requirements/profiles/scaffold-build.lock requirements/profiles/scaffold-lint.lock; do
            if ! test -s "$lock" || ! grep -q -- '--hash=sha256:' "$lock"; then
              echo "Missing reviewed hash lock: $lock" >&2
              exit 1
            fi
          done

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: |
            requirements/profiles/scaffold-test.lock
            requirements/profiles/scaffold-build.lock
            requirements/profiles/scaffold-lint.lock

      - name: Re-run isolated release checks
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/testenv"
          python -m venv "$RUNNER_TEMP/buildenv"
          python -m venv "$RUNNER_TEMP/lintenv"
          testpy="$RUNNER_TEMP/testenv/bin/python"
          buildpy="$RUNNER_TEMP/buildenv/bin/python"
          lintpy="$RUNNER_TEMP/lintenv/bin/python"
          "$testpy" -m pip install --require-hashes --no-deps -r requirements/profiles/scaffold-test.lock
          "$buildpy" -m pip install --require-hashes --no-deps -r requirements/profiles/scaffold-build.lock
          "$lintpy" -m pip install --require-hashes --no-deps -r requirements/profiles/scaffold-lint.lock
          "$testpy" -m pip check
          "$buildpy" -m pip check
          "$lintpy" -m pip check
          "$testpy" scripts/check_tracked_secrets.py
          PYTHONPATH=. "$testpy" scripts/verify_omega_candidate_boundaries.py
          "$testpy" infra/omega_staging/verify_production_boundary.py
          "$testpy" scripts/verify_omega_scaffold_structure.py --root .
          "$RUNNER_TEMP/lintenv/bin/cfn-lint" infra/omega_staging/foundation.yaml infra/omega_staging/service.yaml
          targets=(dashboard src/omega_contracts scripts/prepare_omega_scaffold_build_context.py scripts/generate_omega_phase4_schemas.py scripts/verify_omega_scaffold_package.py scripts/verify_omega_scaffold_structure.py tests/omega_dashboard tests/omega_contracts)
          "$RUNNER_TEMP/lintenv/bin/ruff" check --select E4,E7,E9,F,I "${targets[@]}"
          "$RUNNER_TEMP/lintenv/bin/ruff" format --check "${targets[@]}"
          "$testpy" scripts/generate_omega_phase4_schemas.py --output-directory docs/omega_stage2/phase4 --check
          PYTHONDONTWRITEBYTECODE=1 "$testpy" -m pytest -q -p no:cacheprovider tests/omega_contracts tests/omega_dashboard
          context="$RUNNER_TEMP/omega-build-context"
          "$buildpy" scripts/prepare_omega_scaffold_build_context.py --repository-root . --destination "$context"
          (cd "$context" && "$buildpy" -m build --no-isolation --wheel)
          wheel="$context/dist/omega_trust_scaffold-0.4.0-py3-none-any.whl"
          wheel_sha="$($testpy -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$wheel")"
          "$testpy" scripts/verify_omega_scaffold_package.py wheel --wheel "$wheel" --allowlist docs/omega_stage2/phase4/WHEEL_CONTENT_ALLOWLIST.txt
          mkdir -p dist
          cp "$wheel" dist/omega_trust_scaffold-0.4.0-py3-none-any.whl
          echo "WHEEL_SHA256=$wheel_sha" >> "$GITHUB_ENV"

      - name: Configure dedicated AWS staging identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.OMEGA_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.OMEGA_STAGING_AWS_REGION }}
          role-session-name: omega-staging-${{ github.run_id }}
          allowed-account-ids: ${{ vars.OMEGA_STAGING_AWS_ACCOUNT_ID }}

      - name: Verify account, region, budget, and foundation
        id: foundation
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID" || { echo 'AWS account mismatch' >&2; exit 1; }
          test "${AWS_DEFAULT_REGION:-}" = "$AWS_REGION" || { echo 'AWS region mismatch' >&2; exit 1; }

          aws budgets describe-budget --account-id "$AWS_ACCOUNT_ID" --budget-name "$BUDGET_NAME" > "$RUNNER_TEMP/omega-budget.json"
          python - <<'PY'
          import json, os
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          budget = json.loads((Path(os.environ['RUNNER_TEMP']) / 'omega-budget.json').read_text())['Budget']
          try:
              actual = Decimal(budget['CalculatedSpend']['ActualSpend']['Amount'])
              limit = Decimal(budget['BudgetLimit']['Amount'])
          except (KeyError, InvalidOperation) as exc:
              raise SystemExit(f'Budget is missing a usable actual-spend or limit field: {exc}')
          if actual > limit:
              raise SystemExit(f'Budget actual spend {actual} exceeds limit {limit}')
          print(f'budget gate passed: actual={actual} limit={limit} unit={budget["BudgetLimit"]["Unit"]}')
          PY

          foundation_status="$(aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" --query 'Stacks[0].StackStatus' --output text)"
          case "$foundation_status" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Foundation stack is not in an approved complete state: $foundation_status" >&2; exit 1 ;;
          esac

          output() {
            aws cloudformation describe-stacks --stack-name "$FOUNDATION_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          repository_uri="$(output RepositoryUri)"
          ecr_access_role="$(output AppRunnerEcrAccessRoleArn)"
          instance_role="$(output AppRunnerInstanceRoleArn)"
          auth_secret="$(output DashboardAuthSecretArn)"
          cfn_role="$(output ServiceCloudFormationRoleArn)"
          vpc_connector="$(output AppRunnerVpcConnectorArn)"
          expected_repository="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPOSITORY_NAME"
          test "$repository_uri" = "$expected_repository" || { echo 'Foundation ECR repository mismatch' >&2; exit 1; }
          test "$ecr_access_role" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/baseball-predictor-omega-staging-ecr-access" || exit 1
          test "$instance_role" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/baseball-predictor-omega-staging-instance" || exit 1
          test "$cfn_role" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/baseball-predictor-omega-staging-cfn" || exit 1
          [[ "$auth_secret" == arn:aws:secretsmanager:"$AWS_REGION":"$AWS_ACCOUNT_ID":secret:* ]] || exit 1
          [[ "$vpc_connector" == arn:aws:apprunner:"$AWS_REGION":"$AWS_ACCOUNT_ID":vpcconnector/* ]] || exit 1
          {
            echo "repository_uri=$repository_uri"
            echo "ecr_access_role=$ecr_access_role"
            echo "instance_role=$instance_role"
            echo "auth_secret=$auth_secret"
            echo "cfn_role=$cfn_role"
            echo "vpc_connector=$vpc_connector"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push immutable exact-commit image
        id: image
        env:
          REPOSITORY_URI: ${{ steps.foundation.outputs.repository_uri }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          if aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids imageTag="$SOURCE_COMMIT" >/dev/null 2>&1; then
            digest="$(aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids imageTag="$SOURCE_COMMIT" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ECR returned an invalid existing image digest' >&2; exit 1; }
            docker pull "$REPOSITORY_URI@$digest"
            revision="$(docker image inspect "$REPOSITORY_URI@$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$revision" = "$SOURCE_COMMIT" || { echo 'Existing immutable image revision label does not match source commit' >&2; exit 1; }
            echo 'Verified and reusing the existing immutable exact-commit image.'
          else
            docker build \
              --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
              --build-arg SCAFFOLD_WHEEL_SHA256="$WHEEL_SHA256" \
              --tag "$REPOSITORY_URI:$SOURCE_COMMIT" .
            revision="$(docker image inspect "$REPOSITORY_URI:$SOURCE_COMMIT" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$revision" = "$SOURCE_COMMIT" || { echo 'Built image revision label does not match source commit' >&2; exit 1; }
            docker push "$REPOSITORY_URI:$SOURCE_COMMIT"
            digest="$(aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids imageTag="$SOURCE_COMMIT" --query 'imageDetails[0].imageDigest' --output text)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'ECR returned an invalid pushed image digest' >&2; exit 1; }
          fi
          image_identifier="$REPOSITORY_URI@$digest"
          echo "image_identifier=$image_identifier" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy private App Runner service
        env:
          IMAGE_IDENTIFIER: ${{ steps.image.outputs.image_identifier }}
          ECR_ACCESS_ROLE: ${{ steps.foundation.outputs.ecr_access_role }}
          INSTANCE_ROLE: ${{ steps.foundation.outputs.instance_role }}
          AUTH_SECRET: ${{ steps.foundation.outputs.auth_secret }}
          CFN_ROLE: ${{ steps.foundation.outputs.cfn_role }}
          VPC_CONNECTOR: ${{ steps.foundation.outputs.vpc_connector }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK" \
            --template-file infra/omega_staging/service.yaml \
            --role-arn "$CFN_ROLE" \
            --no-fail-on-empty-changeset \
            --tags Environment=omega-staging ResearchOnly=true Production=false SourceCommit="$SOURCE_COMMIT" \
            --parameter-overrides \
              ImageIdentifier="$IMAGE_IDENTIFIER" \
              SourceCommit="$SOURCE_COMMIT" \
              EcrAccessRoleArn="$ECR_ACCESS_ROLE" \
              InstanceRoleArn="$INSTANCE_ROLE" \
              DashboardAuthSecretArn="$AUTH_SECRET" \
              VpcConnectorArn="$VPC_CONNECTOR"

      - name: Verify deployed identity and private boundary
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.image_identifier }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          service_arn="$(aws cloudformation describe-stacks --stack-name "$SERVICE_STACK" --query "Stacks[0].Outputs[?OutputKey=='ServiceArn'].OutputValue | [0]" --output text)"
          [[ "$service_arn" == arn:aws:apprunner:"$AWS_REGION":"$AWS_ACCOUNT_ID":service/"$SERVICE_NAME"/* ]] || { echo 'Unexpected App Runner service ARN' >&2; exit 1; }
          aws apprunner describe-service --service-arn "$service_arn" > "$RUNNER_TEMP/omega-service.json"
          SERVICE_ARN="$service_arn" EXPECTED_IMAGE="$EXPECTED_IMAGE" python - <<'PY'
          import json, os
          from pathlib import Path

          service = json.loads((Path(os.environ['RUNNER_TEMP']) / 'omega-service.json').read_text())['Service']
          expected = {
              'ServiceName': 'baseball-predictor-omega-staging',
              'Status': 'RUNNING',
          }
          for key, value in expected.items():
              if service.get(key) != value:
                  raise SystemExit(f'{key} mismatch: {service.get(key)!r}')
          source = service['SourceConfiguration']
          if source.get('AutoDeploymentsEnabled') is not False:
              raise SystemExit('automatic deployment is unexpectedly enabled')
          image = source['ImageRepository']['ImageIdentifier']
          if image != os.environ['EXPECTED_IMAGE']:
              raise SystemExit('deployed image digest does not match the exact pushed digest')
          public = service['NetworkConfiguration']['IngressConfiguration']['IsPubliclyAccessible']
          if public is not False:
              raise SystemExit('staging service is unexpectedly public')
          egress = service['NetworkConfiguration']['EgressConfiguration']
          if egress.get('EgressType') != 'VPC':
              raise SystemExit('staging service is not bound to isolated VPC egress')
          if not str(egress.get('VpcConnectorArn', '')).startswith('arn:aws:apprunner:'):
              raise SystemExit('staging service has no bound VPC connector')
          print('private exact-commit App Runner deployment verified')
          PY
          {
            echo '### Omega staging deployment'
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Service ARN: \`$service_arn\`"
            echo '- Ingress: private'
            echo '- Automatic deployment: disabled'
            echo '- Model state: research-only, no ACTIVE candidate'
          } >> "$GITHUB_STEP_SUMMARY"
