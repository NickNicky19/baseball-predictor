name: Full-game Opportunity Receipt Replay v1 Linux Gate

"on":
  pull_request:
    branches:
      - codex/pitcher-joint-opportunity-v1
    paths:
      - ".github/workflows/full-game-opportunity-receipt-replay-v1-linux.yml"
      - "requirements-prospective-batter-opportunity-ci.lock"
      - "config/full_game_opportunity_receipt_replay_v1.json"
      - "config/full_game_opportunity_cross_envelope_v1_authority.json"
      - "config/projected_lineup_contract_v1.json"
      - "reports/full_game_opportunity_receipt_replay_v1.md"
      - "reports/full_game_opportunity_receipt_replay_v1_manifest.json"
      - "src/evaluation/full_game_opportunity_receipt_replay_v1.py"
      - "src/evaluation/full_game_opportunity_cross_envelope_v1.py"
      - "src/evaluation/full_game_opportunity_cross_envelope_release.py"
      - "src/evaluation/forward_pitcher_context.py"
      - "src/evaluation/forward_pitcher_context_v2.py"
      - "src/evaluation/pitcher_joint_opportunity_v1.py"
      - "src/evaluation/projected_lineup_contract.py"
      - "src/evaluation/projected_lineup_official_roster.py"
      - "src/evaluation/prospective_batter_opportunity.py"
      - "src/evaluation/shadow_capture_plan.py"
      - "tests/test_full_game_opportunity_receipt_replay_v1.py"
      - "tests/test_full_game_opportunity_cross_envelope_v1.py"
      - "tests/test_full_game_opportunity_cross_envelope_release.py"
      - "tests/test_pitcher_joint_opportunity_v1.py"
      - "tests/test_pitcher_joint_opportunity_release.py"
      - "tests/test_pitcher_source_truth_release.py"
      - "tests/test_projected_lineup_contract.py"
      - "tests/test_projected_lineup_empirical_joint.py"
      - "tests/test_projected_lineup_history.py"
      - "tests/test_projected_lineup_official_roster.py"
      - "tests/test_projected_lineup_roster_runner.py"
      - "tests/test_prospective_batter_opportunity.py"
      - "tests/test_prospective_batter_opportunity_history.py"
      - "tests/test_run_prospective_batter_opportunity_tick.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-candidate:
    name: Ubuntu 24.04 / CPython 3.12.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: "."

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: "x64"

      - name: Install exact test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r requirements-prospective-batter-opportunity-ci.lock
          python -m pip check
          python --version
          python -m pytest --version
          sha256sum requirements-prospective-batter-opportunity-ci.lock

      - name: Validate exact release manifest and focused boundary
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_full_game_opportunity_receipt_replay_v1.py

      - name: Run combined receipt-replay and cross-envelope suite
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_full_game_opportunity_receipt_replay_v1.py \
            tests/test_full_game_opportunity_cross_envelope_v1.py \
            tests/test_full_game_opportunity_cross_envelope_release.py

      - name: Run inherited source-truth and opportunity regressions
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_projected_lineup_contract.py \
            tests/test_projected_lineup_history.py \
            tests/test_projected_lineup_official_roster.py \
            tests/test_projected_lineup_empirical_joint.py \
            tests/test_prospective_batter_opportunity.py \
            tests/test_prospective_batter_opportunity_history.py \
            tests/test_projected_lineup_roster_runner.py \
            tests/test_run_prospective_batter_opportunity_tick.py \
            tests/test_pitcher_source_truth_release.py \
            tests/test_pitcher_joint_opportunity_v1.py \
            tests/test_pitcher_joint_opportunity_release.py \
            --deselect tests/test_pitcher_source_truth_release.py::test_current_pitcher_source_truth_release_verifies \
            --deselect tests/test_pitcher_joint_opportunity_release.py::test_release_manifest_and_exact_delta_verify

      - name: Verify tracked source contains no likely credentials
        run: python scripts/check_tracked_secrets.py

      - name: Prove tests did not mutate the checkout
        run: git diff --exit-code
