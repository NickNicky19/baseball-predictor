name: Weekly Validation Report

# Runs the from-pairs validation (read-only: computes per-category bias/error
# WITHOUT changing the model or enabling corrections) and writes a plain-text
# report you can read from the GitHub mobile app. Also runs a retrain dry-run
# so you can see what corrections WOULD be, without applying them.
#
# Schedule: Mondays 15:30 UTC. Change or remove as you like.

on:
  schedule:
    - cron: "30 15 * * 1"   # Mondays 15:30 UTC
  workflow_dispatch:
    inputs:
      lookback:
        description: "Days of pairs to include"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run validation + retrain dry-run
        run: |
          mkdir -p reports
          LOOKBACK="${{ github.event.inputs.lookback }}"
          LOOKBACK="${LOOKBACK:-14}"
          STAMP="$(TZ=America/New_York date +%F)"
          REPORT="reports/validation_${STAMP}.md"
          {
            echo "# Validation report — ${STAMP}"
            echo ""
            echo "Lookback: ${LOOKBACK} days. Corrections OFF (read-only)."
            echo ""
            echo '## Per-category validation (from pairs)'
            echo '```'
            python run_validate.py --from-pairs --lookback "${LOOKBACK}" 2>&1 || true
            echo '```'
            echo ""
            echo '## Retrain dry-run (what corrections WOULD be — not applied)'
            echo '```'
            python run_retrain.py --lookback "${LOOKBACK}" --dry-run --verbose 2>&1 || true
            echo '```'
          } > "${REPORT}"
          # Keep a stable "latest" copy that's easy to bookmark on mobile.
          cp "${REPORT}" reports/latest.md
          echo "Wrote ${REPORT}"

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports || true
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Weekly validation report [skip ci]"
            git push
          fi
