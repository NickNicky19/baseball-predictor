name: Authorized Official 2023 Shared PA Outcome Boxscore Capture

"on":
  workflow_dispatch:
    inputs:
      expected_workflow_commit_sha:
        description: Exact isolated workflow-authority commit to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authorized-official-2023-shared-pa-outcome-boxscores
  cancel-in-progress: false

jobs:
  capture:
    name: Ubuntu 24.04 / exact 2023 official boxscore bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CARRIER_COMMIT: 0f7973733a23bbe64070b19875a3846f299fa505
      EXPECTED_RUNTIME_ATTESTATION_SHA256: e30d7fbae4dda48856f2bf2256f900def2553dd47387fe121c105a91d5836b70
      EXPECTED_RUNTIME_POLICY_SHA256: a281342cc5bf135cfb8645712e974ce254bc88a580ab550cee27eca2c700c193
      EXPECTED_SOURCE_BUNDLE_SHA256: 8988ad4ea0687d1fa2754bd8203c2e2d5825bc572877abe86dd7e25eabac498c
      EXPECTED_SOURCE_AUTHORIZATION_SHA256: 2934edc151599ea839aba940f0c5b51c650c7bd4210fc24aaef98dbe76ad226e
      EXPECTED_REQUEST_PLAN_SHA256: ddcf60a1f077c25b151c24c538ab3dd6eca4f9186317207de79cf191d5931490
      RUNTIME_POLICY: config/shared_pa_outcome_boxscore_runtime_authority_v1.json
      SOURCE_AUTHORIZATION: config/shared_pa_outcome_historical_source_access_authorization_20260731_v1.json
      REQUEST_PLAN: reports/shared_pa_outcome_boxscore_capture_plan_v1.json

    steps:
      - name: Check out the isolated workflow authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: workflow-authority

      - name: Bind the manually dispatched workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C workflow-authority rev-parse HEAD)"
          test "$observed" = "${{ inputs.expected_workflow_commit_sha }}"
          test "$observed" = "$GITHUB_SHA"
          test -z "$(git -C workflow-authority status --porcelain=v1 --untracked-files=all)"

      - name: Check out the exact certified carrier commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0f7973733a23bbe64070b19875a3846f299fa505
          path: source

      - name: Reject moving or substituted source bytes
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C source rev-parse HEAD)"
          test "$observed" = "$CARRIER_COMMIT"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.3"
          architecture: "x64"

      - name: Create a new isolated output location
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/official-2023-shared-pa-outcome-boxscores-${CARRIER_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact="official-2023-shared-pa-outcome-boxscores-${CARRIER_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$root"
          install -d -m 0700 "$root" "$root/capture" "$root/work"
          printf 'CAPTURE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf 'ARTIFACT_NAME=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Install the exact hash-locked capture environment
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          capture_python="${RUNNER_TEMP}/pa-source-env/bin/python"
          python -m venv --without-pip "${RUNNER_TEMP}/pa-source-env"
          python -m pip --python "$capture_python" install \
            --disable-pip-version-check --no-compile --no-deps --require-hashes \
            -r source/requirements-direct-batter-pa-source-authority.lock
          python -m pip --python "$capture_python" check

      - name: Reproduce the externally approved clean-Linux runtime
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          capture_python="${RUNNER_TEMP}/pa-source-env/bin/python"
          attestation="${CAPTURE_ROOT}/runtime-attestation.json"
          "$capture_python" -I -B scripts/verify_direct_batter_pa_source_runtime_authority.py \
            --policy "$RUNTIME_POLICY" \
            --write-linux-attestation "$attestation"
          observed="$(sha256sum "$attestation" | awk '{print $1}')"
          printf '%s\n' "$observed" > "${CAPTURE_ROOT}/runtime-attestation.sha256"
          test "$observed" = "$EXPECTED_RUNTIME_ATTESTATION_SHA256"

      - name: Verify every certified capture authority before network access
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          capture_python="${RUNNER_TEMP}/pa-source-env/bin/python"
          printf '%s  %s\n' "$EXPECTED_RUNTIME_POLICY_SHA256" "$RUNTIME_POLICY" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_SOURCE_AUTHORIZATION_SHA256" "$SOURCE_AUTHORIZATION" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_REQUEST_PLAN_SHA256" "$REQUEST_PLAN" | sha256sum -c -
          observed_bundle="$("$capture_python" -I -B -c 'import sys; sys.path.insert(0, "."); from scripts.capture_shared_pa_outcome_boxscores_v1 import source_bundle_sha256; print(source_bundle_sha256())')"
          test "$observed_bundle" = "$EXPECTED_SOURCE_BUNDLE_SHA256"
          {
            printf 'carrier_commit=%s\n' "$CARRIER_COMMIT"
            printf 'workflow_commit=%s\n' "${{ inputs.expected_workflow_commit_sha }}"
            printf 'runtime_attestation_sha256=%s\n' "$EXPECTED_RUNTIME_ATTESTATION_SHA256"
            printf 'runtime_policy_sha256=%s\n' "$EXPECTED_RUNTIME_POLICY_SHA256"
            printf 'source_bundle_sha256=%s\n' "$EXPECTED_SOURCE_BUNDLE_SHA256"
            printf 'source_authorization_sha256=%s\n' "$EXPECTED_SOURCE_AUTHORIZATION_SHA256"
            printf 'request_plan_sha256=%s\n' "$EXPECTED_REQUEST_PLAN_SHA256"
            printf 'endpoint_template=https://statsapi.mlb.com/api/v1/game/{gamePk}/boxscore\n'
            printf 'query_parameters=none\n'
            printf 'minimum_request_start_interval_seconds=1.10\n'
            printf 'maximum_lifetime_attempts_per_request=4\n'
          } > "${CAPTURE_ROOT}/execution-authority.txt"

      - name: Capture only the 2430 authorized raw final-boxscore responses
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          capture_python="${RUNNER_TEMP}/pa-source-env/bin/python"
          "$capture_python" -I -B scripts/capture_shared_pa_outcome_boxscores_v1.py capture \
            --plan "$REQUEST_PLAN" \
            --runtime-policy "$RUNTIME_POLICY" \
            --runtime-attestation "${CAPTURE_ROOT}/runtime-attestation.json" \
            --expected-runtime-attestation-sha256 "$EXPECTED_RUNTIME_ATTESTATION_SHA256" \
            --source-access-authorization "$SOURCE_AUTHORIZATION" \
            --expected-source-access-authorization-sha256 "$EXPECTED_SOURCE_AUTHORIZATION_SHA256" \
            --output-dir "${CAPTURE_ROOT}/capture" \
            --work-dir "${CAPTURE_ROOT}/work" \
            --minimum-request-interval-seconds 1.10 \
            --maximum-attempts 4 \
            --overall-timeout-seconds 7200 \
            2>&1 | tee "${CAPTURE_ROOT}/capture-command.log"

      - name: Verify the completed raw capture and preserve coverage identity
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          capture_python="${RUNNER_TEMP}/pa-source-env/bin/python"
          manifest="${CAPTURE_ROOT}/capture/manifest.json"
          digest="$("$capture_python" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["observed_capture_digest"])' "$manifest")"
          "$capture_python" -I -B scripts/capture_shared_pa_outcome_boxscores_v1.py verify \
            --capture-dir "${CAPTURE_ROOT}/capture" \
            --expected-capture-digest "$digest" \
            2>&1 | tee "${CAPTURE_ROOT}/verification-command.log"
          printf '%s\n' "$digest" > "${CAPTURE_ROOT}/capture-digest.txt"
          cp "$RUNTIME_POLICY" "${CAPTURE_ROOT}/runtime-policy.json"
          cp "$SOURCE_AUTHORIZATION" "${CAPTURE_ROOT}/source-access-authorization.json"
          cp "$REQUEST_PLAN" "${CAPTURE_ROOT}/request-plan.json"
          cp requirements-direct-batter-pa-source-authority.lock "${CAPTURE_ROOT}/requirements.lock"

      - name: Prove both source checkouts remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -C source diff --exit-code
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          git -C workflow-authority diff --exit-code
          test -z "$(git -C workflow-authority status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable raw capture, receipts, failures, and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.CAPTURE_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
